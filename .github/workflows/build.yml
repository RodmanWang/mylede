name: 编译并发布 MyLEDE 固件

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 固件 Linux 内核版本（留空自动选择 LEDE x86 目录中最高可用版本；也可手动填写，例如 6.6 或 6.12）
        type: string
        required: false
        default: ''
      kernel_partsize:
        description: 内核分区大小（MiB）；上游源码默认为 64 MiB（上次成功 Manifest 记录）
        type: string
        required: false
        default: '256'
      rootfs_partsize:
        description: 根文件系统分区大小（MiB）；上游源码默认为 448 MiB（上次成功 Manifest 记录）
        type: string
        required: false
        default: '4096'
      change_lan_ip:
        description: 是否修改固件默认 LAN 管理地址
        type: boolean
        required: false
        default: false
      lan_ip:
        description: 自定义 LAN 地址（仅 RFC1918 私有 IPv4 有效，默认 192.168.1.1）
        type: string
        required: false
        default: '192.168.1.1'
      force_rebuild:
        description: 忽略成功编译记录，强制重新编译固件
        type: boolean
        required: false
        default: false
      rebuild_toolchain:
        description: 强制重新编译基础工具和交叉编译工具链（耗时较长）
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read
  actions: write


concurrency:
  group: mylede-x86_64-staged-build
  cancel-in-progress: false

jobs:
  source_check:
    name: 预检：锁定全部源码版本
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      lede_commit: ${{ steps.detect.outputs.lede_commit }}
      lede_ref: ${{ steps.detect.outputs.lede_ref }}
      fingerprint: ${{ steps.detect.outputs.fingerprint }}
      skip_build: ${{ steps.decision.outputs.skip_build }}
      last_kernel_partsize: ${{ steps.last_partition_defaults.outputs.kernel_partsize }}
      last_rootfs_partsize: ${{ steps.last_partition_defaults.outputs.rootfs_partsize }}
      last_upstream_kernel_partsize: ${{ steps.last_partition_defaults.outputs.upstream_kernel_partsize }}
      last_upstream_rootfs_partsize: ${{ steps.last_partition_defaults.outputs.upstream_rootfs_partsize }}
    steps:
      - name: 检出 MyLEDE 仓库源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 读取上次成功发布 Manifest 的分区默认值
        id: last_partition_defaults
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - build-config/last-successful-partition-layout.json <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          values = {
              "kernel_partsize": data.get("kernel_partsize_mib"),
              "rootfs_partsize": data.get("rootfs_partsize_mib"),
              "upstream_kernel_partsize": (data.get("upstream_defaults_mib") or {}).get("kernel_partsize"),
              "upstream_rootfs_partsize": (data.get("upstream_defaults_mib") or {}).get("rootfs_partsize"),
          }
          for name, value in values.items():
              if not isinstance(value, int) or isinstance(value, bool) or value <= 0:
                  raise SystemExit(f"持久化分区配置无效：{name}={value!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for name, value in values.items():
                  stream.write(f"{name}={value}\n")
          print("上次成功固件分区：Kernel={} MiB，Rootfs={} MiB".format(
              values["kernel_partsize"], values["rootfs_partsize"]))
          print("Manifest 上游默认值：Kernel={} MiB，Rootfs={} MiB".format(
              values["upstream_kernel_partsize"], values["upstream_rootfs_partsize"]))
          PY

      - name: 运行 OTA 版本契约测试
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/ota -p 'test_*.py' -v
          sh -n luci-app-myupdate/root/usr/libexec/myupdate/task.sh
          sh -n luci-app-myupdate/root/usr/libexec/myupdate/verify-manifest.sh
          sh -n luci-app-myupdate/root/usr/libexec/myupdate/check-partition-layout.sh
          bash tests/ota/test_partition_layout.sh

      - name: 检测 LEDE、软件源及自定义软件包版本
        id: detect
        env:
          BUILD_TARGET: x86_64
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          KERNEL_PARTSIZE: ${{ inputs.kernel_partsize || steps.last_partition_defaults.outputs.kernel_partsize || '256' }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize || steps.last_partition_defaults.outputs.rootfs_partsize || '4096' }}
          CHANGE_LAN_IP: ${{ inputs.change_lan_ip }}
          LAN_IP: ${{ inputs.lan_ip || '192.168.1.1' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$KERNEL_PARTSIZE" "$ROOTFS_PARTSIZE" <<'PY'
          import re, sys
          for name, value in zip(("KERNEL_PARTSIZE", "ROOTFS_PARTSIZE"), sys.argv[1:]):
              if not re.fullmatch(r"[1-9][0-9]*", value):
                  raise SystemExit(f"{name} 必须是大于 0 的整数 MB，当前值：{value!r}")
          PY

          if [[ "$CHANGE_LAN_IP" == 'true' ]]; then
            python3 - "$LAN_IP" <<'PY'
          import ipaddress, sys
          try:
              ip = ipaddress.IPv4Address(sys.argv[1])
          except ipaddress.AddressValueError:
              raise SystemExit('LAN_IP 不是合法 IPv4 地址')
          private = [ipaddress.ip_network('10.0.0.0/8'), ipaddress.ip_network('172.16.0.0/12'), ipaddress.ip_network('192.168.0.0/16')]
          if not any(ip in net for net in private):
              raise SystemExit('LAN_IP 必须属于 RFC1918 私有地址范围：10/8、172.16/12 或 192.168/16')
          if ip.packed[-1] in (0, 255):
              raise SystemExit('LAN_IP 不能使用 .0 或 .255 主机地址')
          PY
          fi

          LEDE_URL='https://github.com/coolsnowwolf/lede.git'
          LEDE_REF="$(git ls-remote --symref "$LEDE_URL" HEAD | awk '$1 == "ref:" && $3 == "HEAD" {print $2; exit}')"
          if [[ ! "$LEDE_REF" =~ ^refs/heads/.+ ]]; then
            echo '::error::无法从 coolsnowwolf/lede 远程 HEAD 解析默认分支。'
            exit 1
          fi
          LEDE_BRANCH="${LEDE_REF#refs/heads/}"
          LEDE_COMMIT="$(git ls-remote "$LEDE_URL" "$LEDE_REF" | awk -v ref="$LEDE_REF" '$2 == ref {print $1; exit}')"
          if [[ ! "$LEDE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::无法获取 coolsnowwolf/lede 默认分支版本：$LEDE_REF"
            exit 1
          fi

          # Clone the complete LEDE source tree first. All subsequent feed/plugin
          # discovery and upstream revision checks are based on this checkout.
          # The exact commit is pinned even if the default branch moves between ls-remote and clone.
          LEDE_PREFLIGHT_REPO="$RUNNER_TEMP/lede-preflight"
          git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 \
            clone --depth=1 --single-branch --branch "$LEDE_BRANCH" "$LEDE_URL" "$LEDE_PREFLIGHT_REPO"
          if [[ "$(git -C "$LEDE_PREFLIGHT_REPO" rev-parse HEAD)" != "$LEDE_COMMIT" ]]; then
            git -C "$LEDE_PREFLIGHT_REPO" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 \
              fetch --no-tags --depth=1 origin "$LEDE_COMMIT"
            git -C "$LEDE_PREFLIGHT_REPO" reset --hard "$LEDE_COMMIT"
          fi
          [[ "$(git -C "$LEDE_PREFLIGHT_REPO" rev-parse HEAD)" == "$LEDE_COMMIT" ]] || {
            echo '::error::完整 LEDE 源码未能固定到预检提交。'
            exit 1
          }
          FEEDS_FILE="$LEDE_PREFLIGHT_REPO/feeds.conf.default"
          [[ -s "$FEEDS_FILE" ]] || { echo '::error::锁定的 LEDE 工作树中 feeds.conf.default 不存在或为空。'; exit 1; }
          FEEDS_SHA256="$(sha256sum "$FEEDS_FILE" | awk '{print $1}')"

          python3 - "$FEEDS_FILE" "$RUNNER_TEMP/source-repositories.tsv" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/minisign-repository.txt" <<'PY'
          import re, sys
          from pathlib import Path

          feeds_file = Path(sys.argv[1])
          output_file = Path(sys.argv[2])
          repo_root = Path(sys.argv[3])
          minisign_repo_output = Path(sys.argv[4])
          repositories = set()

          def add(name, url, ref):
              repositories.add((name, url, ref))

          def make_value(relative_path, variable):
              path = repo_root / relative_path
              pattern = re.compile(
                  rf"^[ \t]*{re.escape(variable)}[ \t]*(?:\+|:|\?)?=[ \t]*([^ \t#]+)",
                  re.MULTILINE,
              )
              matches = pattern.findall(path.read_text(encoding="utf-8"))
              if len(matches) != 1:
                  raise SystemExit(
                      f"{relative_path}: expected exactly one {variable} assignment, found {len(matches)}"
                  )
              return matches[0]

          def github_git_url(source_url, source_name):
              match = re.match(
                  r"^https://github\.com/([^/]+/[^/]+?)(?:\.git)?(?:/archive/.*)?$",
                  source_url,
              )
              if not match:
                  raise SystemExit(
                      f"{source_name} source URL is not a supported GitHub repository URL: {source_url}"
                  )
              return f"https://github.com/{match.group(1)}.git"

          for raw_line in feeds_file.read_text(encoding='utf-8', errors='replace').splitlines():
              line = raw_line.strip()
              if not line or line.startswith('#'):
                  continue
              fields = line.split()
              if len(fields) < 3 or not fields[0].startswith('src-git'):
                  continue
              name, source = fields[1], fields[2]
              if ';' in source:
                  url, branch = source.rsplit(';', 1)
                  ref = f'refs/heads/{branch}'
              else:
                  url, ref = source, 'HEAD'
              if url:
                  add(f'feed:{name}', url, ref)

          # Derive all custom upstream URLs from the same package recipes used
          # by LEDE. Changing a Makefile source URL automatically changes locking.
          add('plugin:smartdns',
              github_git_url(make_value("smartdns/Makefile", "PKG_SOURCE_URL"), "smartdns"),
              'HEAD')
          add('plugin:smartdns_webui',
              github_git_url(make_value("smartdns/Makefile", "SMARTDNS_WEBUI_SOURCE_URL"), "smartdns webui"),
              'HEAD')
          add('plugin:luci_app_smartdns',
              github_git_url(make_value("luci-app-smartdns/Makefile", "PKG_SOURCE_URL"), "LuCI SmartDNS"),
              'HEAD')

          # Use the feed declaration consumed by scripts/03-update-feeds.sh.
          feeds_script = (repo_root / "scripts/03-update-feeds.sh").read_text(encoding="utf-8")
          feed_match = re.search(
              r"""OPENCLASH_FEED=['"]src-git[ \t]+([^ \t'"]+)[ \t]+([^'"]+)['"]""",
              feeds_script,
          )
          if not feed_match:
              raise SystemExit("Cannot discover OPENCLASH_FEED declaration in scripts/03-update-feeds.sh")
          openclash_name, openclash_source = feed_match.groups()
          if ';' in openclash_source:
              openclash_url, openclash_branch = openclash_source.rsplit(';', 1)
              openclash_ref = f'refs/heads/{openclash_branch}'
          else:
              openclash_url, openclash_ref = openclash_source, 'HEAD'
          add(f'feed:{openclash_name}', openclash_url, openclash_ref)

          minisign_source = make_value("minisign/Makefile", "PKG_SOURCE_URL")
          minisign_repo_output.write_text(
              github_git_url(minisign_source, "minisign") + "\n",
              encoding="utf-8",
          )

          with output_file.open('w', encoding='utf-8') as stream:
              for name, url, ref in sorted(repositories):
                  stream.write(f'{name}\t{url}\t{ref}\n')
          print(f'Found {len(repositories)} unique source references from checked-out LEDE feeds and MyLEDE package recipes.')
          PY

          : > "$RUNNER_TEMP/source-revisions.tsv"
          while IFS=$'\t' read -r repo_name repo_url repo_ref; do
            [[ -n "$repo_name" && -n "$repo_url" && -n "$repo_ref" ]] || continue
            echo "正在检查源码：$repo_name（$repo_url，$repo_ref）"
            remote_output="$(git ls-remote "$repo_url" "$repo_ref")"
            repo_commit="$(printf '%s\n' "$remote_output" | awk -v ref="$repo_ref" '$2 == ref {print $1; exit}')"
            if [[ ! "$repo_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::无法解析 $repo_name（$repo_url）的版本引用 $repo_ref。"
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\n' "$repo_name" "$repo_url" "$repo_ref" "$repo_commit" \
              >> "$RUNNER_TEMP/source-revisions.tsv"
          done < "$RUNNER_TEMP/source-repositories.tsv"

          # Record the exact pinned LEDE checkout in the same immutable lock file.
          printf 'LEDE\t%s\t%s\t%s\n' "$LEDE_URL" "$LEDE_REF" "$LEDE_COMMIT" \
            >> "$RUNNER_TEMP/source-revisions.tsv"

          # Discover stable version tags through Git instead of the GitHub Releases
          # REST API, which returned HTTP 403 on this runner.
          MINISIGN_REPO="$RUNNER_TEMP/minisign-git"
          MINISIGN_TAGS="$RUNNER_TEMP/minisign-tags.txt"
          git init "$MINISIGN_REPO"
          MINISIGN_REPO_URL="$(cat "$RUNNER_TEMP/minisign-repository.txt")"
          git -C "$MINISIGN_REPO" remote add origin "$MINISIGN_REPO_URL"
          git -C "$MINISIGN_REPO" ls-remote --tags --refs origin > "$MINISIGN_TAGS"
          MINISIGN_VERSION="$(python3 - "$MINISIGN_TAGS" <<'PY'
          import re, sys
          from pathlib import Path

          candidates = []
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if len(fields) != 2 or not fields[1].startswith("refs/tags/"):
                  continue
              tag = fields[1][len("refs/tags/"):]
              # Accept plain numeric stable tags (e.g. 0.11 or v0.11), and
              # deliberately exclude prerelease/build-suffix tags.
              match = re.fullmatch(r"v?(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))+(?:\.(0|[1-9][0-9]*))*", tag)
              if not match:
                  continue
              numbers = tuple(int(part) for part in tag.removeprefix("v").split("."))
              candidates.append((numbers, tag))
          if not candidates:
              raise SystemExit("No stable numeric minisign version tags were found via Git.")
          highest = max(numbers for numbers, _ in candidates)
          tags = sorted(tag for numbers, tag in candidates if numbers == highest)
          if len(tags) != 1:
              raise SystemExit(f"Ambiguous minisign tags for latest version {highest}: {tags!r}")
          print(tags[0])
          PY
          )"
          # Fetch the exact release tag in the repository initialized above,
          # then create the source archive locally without re-adding origin.
          MINISIGN_ARCHIVE="$RUNNER_TEMP/minisign-${MINISIGN_VERSION}.tar.gz"
          git -C "$MINISIGN_REPO" fetch --no-tags --depth=1 origin "refs/tags/${MINISIGN_VERSION}"
          git -C "$MINISIGN_REPO" archive --format=tar.gz \
            --prefix="minisign-${MINISIGN_VERSION}/" FETCH_HEAD > "$MINISIGN_ARCHIVE"
          [[ -s "$MINISIGN_ARCHIVE" ]] || {
            echo '::error::从 minisign 锁定的 Git tag 生成源码归档失败或文件为空。'
            exit 1
          }
          python3 scripts/validate_minisign_archive.py "$MINISIGN_ARCHIVE" "$MINISIGN_VERSION"
          MINISIGN_SHA256="$(sha256sum "$MINISIGN_ARCHIVE" | awk '{print $1}')"
          [[ "$MINISIGN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error::无法计算 minisign 源码归档 SHA-256。'
            exit 1
          }
          printf 'MINISIGN_RELEASE\t%s\t%s\t%s\n' "$MINISIGN_REPO_URL" \
            "$MINISIGN_VERSION" "$MINISIGN_SHA256" >> "$RUNNER_TEMP/source-revisions.tsv"
          echo "已锁定 minisign 最新正式 Release：$MINISIGN_VERSION（SHA-256: $MINISIGN_SHA256）"

          # The successful-build persistence commit only updates the remembered
          # partition defaults and workflow_dispatch form hints. Walk through
          # consecutive such commits so that this metadata-only commit does
          # not force an otherwise identical scheduled build to rebuild.
          MYLEDE_BUILD_COMMIT="$GITHUB_SHA"
          while [[ "$(git log -1 --format=%s "$MYLEDE_BUILD_COMMIT")" == "ci(build): remember last successful firmware partition layout" ]]; do
            MYLEDE_BUILD_COMMIT="$(git rev-parse "${MYLEDE_BUILD_COMMIT}^")"
          done
          {
            printf 'LEDE\t%s\n' "$LEDE_COMMIT"
            printf 'FEEDS_CONF_SHA256\t%s\n' "$FEEDS_SHA256"
            printf 'MYLEDE_COMMIT\t%s\n' "$MYLEDE_BUILD_COMMIT"
            printf 'BUILD_TARGET\t%s\n' "$BUILD_TARGET"
            printf 'KERNEL_VERSION\t%s\n' "$KERNEL_VERSION"
            printf 'KERNEL_PARTSIZE\t%s\n' "$KERNEL_PARTSIZE"
            printf 'ROOTFS_PARTSIZE\t%s\n' "$ROOTFS_PARTSIZE"
            printf 'CHANGE_LAN_IP\t%s\n' "$CHANGE_LAN_IP"
            if [[ "$CHANGE_LAN_IP" == 'true' ]]; then printf 'LAN_IP\t%s\n' "$LAN_IP"; fi
            sort "$RUNNER_TEMP/source-revisions.tsv"
          } > "$RUNNER_TEMP/source-fingerprint-input.txt"

          FINGERPRINT="$(sha256sum "$RUNNER_TEMP/source-fingerprint-input.txt" | awk '{print $1}')"
          echo "已锁定 LEDE 源码版本：$LEDE_COMMIT"
          echo "源码指纹：$FINGERPRINT"
          echo "lede_commit=$LEDE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "lede_ref=$LEDE_REF" >> "$GITHUB_OUTPUT"

          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: 打包不可变源码锁定清单和 minisign 源码归档
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/source-lock-artifact"
          install -m 0644 "$RUNNER_TEMP/source-revisions.tsv" "$RUNNER_TEMP/source-lock-artifact/source-revisions.tsv"
          python3 - "$RUNNER_TEMP/source-revisions.tsv" "$RUNNER_TEMP" "$RUNNER_TEMP/source-lock-artifact" <<'PY'
          import re, shutil, sys
          from pathlib import Path

          lock_path, temp_dir, artifact_dir = map(Path, sys.argv[1:])
          entries = [
              line.split("\t")
              for line in lock_path.read_text(encoding="utf-8").splitlines()
              if line.startswith("MINISIGN_RELEASE\t")
          ]
          if len(entries) != 1 or len(entries[0]) != 4:
              raise SystemExit("源码锁定清单必须且只能包含一条有效的 MINISIGN_RELEASE")
          version = entries[0][2]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*", version):
              raise SystemExit(f"无效的 minisign 版本号：{version!r}")
          archive = temp_dir / f"minisign-{version}.tar.gz"
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit(f"预检生成的 minisign 源码归档不存在或为空：{archive}")
          shutil.copyfile(archive, artifact_dir / archive.name)
          print(f"已将 minisign {version} 源码归档加入不可变源码工件")
          PY

      - name: 上传不可变源码锁定清单和 minisign 源码归档
        uses: actions/upload-artifact@v7
        with:
          name: 源码版本锁定清单
          path: ${{ runner.temp }}/source-lock-artifact/
          if-no-files-found: error
          retention-days: 1

      - name: 准备成功编译标记缓存目录
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/lede-build-state"

      - name: 恢复成功编译标记
        id: successful_build
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/lede-build-state
          key: lede-success-${{ steps.detect.outputs.fingerprint }}-${{ github.sha }}

      - name: 判断是否需要重新编译
        id: decision
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          REBUILD_TOOLCHAIN: ${{ inputs.rebuild_toolchain }}
          CACHE_HIT: ${{ steps.successful_build.outputs.cache-hit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$FORCE_REBUILD" == 'true' || "$REBUILD_TOOLCHAIN" == 'true' ]]; then
            echo 'skip_build=false' >> "$GITHUB_OUTPUT"
            echo '已请求手动强制重新编译。'
          elif [[ "$CACHE_HIT" == 'true' ]]; then
            echo 'skip_build=true' >> "$GITHUB_OUTPUT"
            echo '当前源码指纹对应的版本已成功编译并发布。'
          else
            echo 'skip_build=false' >> "$GITHUB_OUTPUT"
            echo '源码版本已变化，或不存在成功编译标记，需要开始编译。'
          fi

  toolchain:
    name: 构建任务一：恢复或编译 LEDE 主机工具与交叉编译工具链
    needs: source_check
    if: needs.source_check.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: 检出 MyLEDE 仓库源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 清理运行器磁盘空间
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: 'azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*'
          remove_packages_one_command: true
          remove_folders: '/usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /opt/pipx /usr/share/swift /usr/share/miniconda /usr/local/julia*'
          rm_cmd: rm
          testing: false

      - name: 检查清理后的磁盘空间
        shell: bash
        run: |
          set -Eeuo pipefail
          df -hT /
          df -i /

      - name: 克隆指定版本的 LEDE 源码
        env:
          LEDE_COMMIT: ${{ needs.source_check.outputs.lede_commit }}
          LEDE_REF: ${{ needs.source_check.outputs.lede_ref }}
        run: bash .github/ci/clone-pinned-lede.sh

      - name: 下载并安装不可变源码版本锁定清单
        uses: actions/download-artifact@v7
        with:
          name: 源码版本锁定清单
          path: ${{ runner.temp }}/source-lock
      - name: 安装源码版本锁定清单
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0644 "$RUNNER_TEMP/source-lock/source-revisions.tsv" /home/ubuntu/source-revisions.tsv

      - name: 计算稳定的工具链缓存标识
        id: toolchain_key
        env:
          REBUILD_TOOLCHAIN: ${{ inputs.rebuild_toolchain }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CONFIG_HASH="$(sha256sum scripts/04-configure.sh .github/ci/install-build-deps.sh .github/ci/build-lede-cmake-host-tool.sh | sha256sum | awk '{print $1}')"
          MIXKEY="ubuntu-24.04-x86_64-${CONFIG_HASH}"
          if [[ "$REBUILD_TOOLCHAIN" == 'true' ]]; then
            MIXKEY="${MIXKEY}-forced-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "config_hash=$CONFIG_HASH" >> "$GITHUB_OUTPUT"
          echo "mixkey=$MIXKEY" >> "$GITHUB_OUTPUT"

      - name: 恢复主机工具与交叉编译工具链缓存
        id: toolchain_cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: false
          toolchain: true
          skip: true
          clean: false
          prefix: /home/ubuntu/lede
          mixkey: ${{ steps.toolchain_key.outputs.mixkey }}

      - name: 从 Release 备用缓存恢复工具链
        id: toolchain_release_fallback
        if: steps.toolchain_cache.outputs.hit != '1'
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          TOOLCHAIN_MIXKEY: ${{ steps.toolchain_key.outputs.mixkey }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y zstd
          fi
          TOOLCHAIN_HASH="$(git -C /home/ubuntu/lede log --pretty=tformat:%h -n1 tools toolchain)"
          ASSET_NAME="toolchain-${TOOLCHAIN_MIXKEY}-${TOOLCHAIN_HASH}.tar.zst"
          echo "正在查找工具链缓存文件：$ASSET_NAME"
          if gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP"; then
            tar --zstd -xf "$RUNNER_TEMP/$ASSET_NAME" -C /home/ubuntu/lede
            sed -i 's/ $(tool.*\/stamp-compile)//;' /home/ubuntu/lede/Makefile
            sed -i 's/ $(tool.*\/stamp-install)//;' /home/ubuntu/lede/Makefile
            echo 'hit=1' >> "$GITHUB_OUTPUT"
            echo '已从 Release 备用缓存恢复工具链。'
          else
            echo 'hit=0' >> "$GITHUB_OUTPUT"
            echo '未找到匹配的 Release 备用缓存。'
          fi

      - name: 首次编译工具链时安装 Ubuntu 24.04 公共编译依赖
        if: steps.toolchain_cache.outputs.hit != '1' && steps.toolchain_release_fallback.outputs.hit != '1'
        run: bash .github/ci/install-build-deps.sh

      - name: 首次编译工具链时准备 MyLEDE 工作目录
        if: steps.toolchain_cache.outputs.hit != '1' && steps.toolchain_release_fallback.outputs.hit != '1'
        run: bash .github/ci/prepare-workspace.sh

      - name: 首次编译工具链时恢复 LEDE 下载缓存
        if: steps.toolchain_cache.outputs.hit != '1' && steps.toolchain_release_fallback.outputs.hit != '1'
        id: toolchain_dl_cache
        uses: actions/cache/restore@v6
        with:
          path: /home/ubuntu/dl
          key: lede-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-toolchain
          restore-keys: |
            lede-dl-${{ runner.os }}-

      - name: 首次编译工具链时运行 01 至 04 号准备脚本
        if: steps.toolchain_cache.outputs.hit != '1' && steps.toolchain_release_fallback.outputs.hit != '1'
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          CHANGE_LAN_IP: ${{ inputs.change_lan_ip }}
          LAN_IP: ${{ inputs.lan_ip || '192.168.1.1' }}
          MYLEDE_SOURCE_LOCK: /home/ubuntu/source-revisions.tsv
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/ubuntu
          for script in 01-check-env.sh 02-update-source.sh 03-update-feeds.sh 04-configure.sh; do
            echo "========== 正在执行脚本：$script =========="
            bash "/home/ubuntu/scripts/$script"
          done

      - name: 仅在两种缓存均未命中时编译主机工具与工具链
        id: toolchain_build
        if: steps.toolchain_cache.outputs.hit != '1' && steps.toolchain_release_fallback.outputs.hit != '1'
        env:
          MYLEDE_SOURCE_LOCK: /home/ubuntu/source-revisions.tsv
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/ubuntu/lede
          rm -rf tmp .config
          make defconfig
          bash "$GITHUB_WORKSPACE/.github/ci/build-lede-cmake-host-tool.sh"
          BUILD_LOG="$RUNNER_TEMP/lede-toolchain-build.log"
          setsid bash -o pipefail -c \
            'timeout --signal=INT --kill-after=30s 315m make V=1 -j"$(nproc)" tools/install toolchain/install 2>&1 | tee "$1"' \
            _ "$BUILD_LOG" &
          BUILD_PID=$!
          BUILD_PGID="$(ps -o pgid= -p "$BUILD_PID" | tr -d ' ')"
          [[ -n "$BUILD_PGID" ]] || { echo '::error::无法识别工具链编译进程组。'; exit 1; }

          (
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              sleep 60
              kill -0 "$BUILD_PID" 2>/dev/null || exit 0
              AVAILABLE_KB="$(df -Pk / | awk 'NR == 2 {print $4}')"
              AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
              echo "工具链磁盘监控：剩余 ${AVAILABLE_GB} GiB。"
              if (( AVAILABLE_KB < 5 * 1024 * 1024 )); then
                echo "::error::工具链编译已停止：磁盘仅剩 ${AVAILABLE_GB} GiB。"
                kill -TERM -- "-$BUILD_PGID" 2>/dev/null || true
                sleep 20
                kill -KILL -- "-$BUILD_PGID" 2>/dev/null || true
                exit 0
              fi
            done
          ) &
          WATCHDOG_PID=$!

          set +e
          wait "$BUILD_PID"
          BUILD_STATUS=$?
          set -e
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          df -hT /
          exit "$BUILD_STATUS"

      - name: 编译失败时上传工具链日志
        if: always() && steps.toolchain_build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: 工具链编译日志-${{ github.run_number }}
          path: ${{ runner.temp }}/lede-toolchain-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 保存工具链阶段的下载缓存
        if: success() && steps.toolchain_build.outcome == 'success'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: /home/ubuntu/dl
          key: lede-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-toolchain

      - name: 发布或更新工具链 Release 备用缓存
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          TOOLCHAIN_MIXKEY: ${{ steps.toolchain_key.outputs.mixkey }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/ubuntu/lede
          TOOLCHAIN_HASH="$(git log --pretty=tformat:%h -n1 tools toolchain)"
          ASSET_NAME="toolchain-${TOOLCHAIN_MIXKEY}-${TOOLCHAIN_HASH}.tar.zst"

          if gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET_NAME"; then
            echo "匹配的 Release 备用缓存已存在：$ASSET_NAME"
            exit 0
          fi

          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y zstd
          fi
          shopt -s nullglob
          CACHE_PATHS=(staging_dir/host* staging_dir/tool*)
          if (( ${#CACHE_PATHS[@]} == 0 )); then
            echo '::warning::未找到主机工具或工具链暂存目录，跳过 Release 备用缓存发布。'
            exit 0
          fi

          ARCHIVE="$RUNNER_TEMP/$ASSET_NAME"
          tar --zstd -cf "$ARCHIVE" "${CACHE_PATHS[@]}"
          ARCHIVE_SIZE="$(stat -c '%s' "$ARCHIVE")"
          echo "工具链备用缓存大小：$ARCHIVE_SIZE 字节"
          if (( ARCHIVE_SIZE >= 1900000000 )); then
            echo '::warning::备用缓存超过 1.9 GB 的安全限制，仍以 Actions 缓存作为主要存储。'
            rm -f "$ARCHIVE"
            exit 0
          fi

          if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create toolchain-cache --repo "$GITHUB_REPOSITORY" \
              --title 'MyLEDE toolchain cache' \
              --notes 'Fallback archive for host tools and the x86_64 cross toolchain. Not a firmware release.' \
              --prerelease --target "$GITHUB_SHA"
          fi

          gh release upload toolchain-cache "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$RUNNER_TEMP/toolchain-assets.txt"
          while IFS= read -r old_asset; do
            [[ -n "$old_asset" ]] || continue
            [[ "$old_asset" == toolchain-*.tar.zst ]] || continue
            [[ "$old_asset" == "$ASSET_NAME" ]] && continue
            gh release delete-asset toolchain-cache "$old_asset" --repo "$GITHUB_REPOSITORY" --yes || true
          done < "$RUNNER_TEMP/toolchain-assets.txt"

      - name: 保存后清理过期的工具链 Actions 缓存
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          MIXKEY: ${{ steps.toolchain_key.outputs.mixkey }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT_KEY="${MIXKEY}-cache-openwrt-$(git -C /home/ubuntu/lede log --pretty=tformat:%h -n1 tools toolchain)"
          gh cache list --repo "$GITHUB_REPOSITORY" --key 'ubuntu-24.04-' \
            --limit 100 --json id,key > "$RUNNER_TEMP/toolchain-caches.json"
          python3 - "$RUNNER_TEMP/toolchain-caches.json" "$CURRENT_KEY" <<'PY' > "$RUNNER_TEMP/delete-toolchain-cache-ids.txt"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          keep = sys.argv[2]
          for item in data:
              if item.get('key') != keep:
                  print(item['id'])
          PY
          while IFS= read -r cache_id; do
            [[ -n "$cache_id" ]] || continue
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY" || true
          done < "$RUNNER_TEMP/delete-toolchain-cache-ids.txt"
  firmware:
    name: 构建任务二：编译软件源、软件包、内核与固件
    needs: [source_check, toolchain]
    if: needs.source_check.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.build_version.outputs.version }}
      tag: ${{ steps.build_version.outputs.tag }}
    steps:
      - name: 检出 MyLEDE 仓库源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 清理运行器磁盘空间
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: 'azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*'
          remove_packages_one_command: true
          remove_folders: '/usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /opt/pipx /usr/share/swift /usr/share/miniconda /usr/local/julia*'
          rm_cmd: rm
          testing: false

      - name: 检查清理后的磁盘空间
        shell: bash
        run: |
          set -Eeuo pipefail
          df -hT /
          df -i /

      - name: 安装 Ubuntu 24.04 公共编译依赖
        run: bash .github/ci/install-build-deps.sh

      - name: 安装 SmartDNS WebUI 所需的 Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 准备 MyLEDE 工作目录
        run: bash .github/ci/prepare-workspace.sh

      - name: 克隆指定版本的 LEDE 源码
        env:
          LEDE_COMMIT: ${{ needs.source_check.outputs.lede_commit }}
          LEDE_REF: ${{ needs.source_check.outputs.lede_ref }}
        run: bash .github/ci/clone-pinned-lede.sh

      - name: 下载并安装不可变源码版本锁定清单
        uses: actions/download-artifact@v7
        with:
          name: 源码版本锁定清单
          path: ${{ runner.temp }}/source-lock
      - name: 安装源码版本锁定清单
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0644 "$RUNNER_TEMP/source-lock/source-revisions.tsv" /home/ubuntu/source-revisions.tsv

      - name: 恢复工具链阶段的 LEDE 下载缓存
        id: firmware_dl_cache
        uses: actions/cache/restore@v6
        with:
          path: /home/ubuntu/dl
          key: lede-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-toolchain
          restore-keys: |
            lede-dl-${{ runner.os }}-

      - name: 安装并校验预检阶段锁定的 minisign 源码归档
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/source-lock" /home/ubuntu/source-revisions.tsv /home/ubuntu/dl <<'PY'
          import hashlib, re, shutil, sys
          from pathlib import Path

          artifact_dir, lock_path, download_dir = map(Path, sys.argv[1:])
          entries = [
              line.split("\t")
              for line in lock_path.read_text(encoding="utf-8").splitlines()
              if line.startswith("MINISIGN_RELEASE\t")
          ]
          if len(entries) != 1 or len(entries[0]) != 4:
              raise SystemExit("源码锁定清单必须且只能包含一条有效的 MINISIGN_RELEASE")
          _, _, version, expected_sha256 = entries[0]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*", version):
              raise SystemExit(f"无效的 minisign 版本号：{version!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", expected_sha256):
              raise SystemExit("源码锁定清单中的 minisign SHA-256 无效")
          archive = artifact_dir / f"minisign-{version}.tar.gz"
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit(f"源码锁定工件缺少 minisign 归档：{archive}")
          actual_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f"minisign 源码归档 SHA-256 不匹配：预期 {expected_sha256}，实际 {actual_sha256}"
              )
          download_dir.mkdir(parents=True, exist_ok=True)
          target = download_dir / archive.name
          shutil.copyfile(archive, target)
          target.chmod(0o644)
          print(f"已安装并校验预检阶段锁定的 minisign 源码归档：{version}")
          PY

      - name: 写入 MyUpdate 固件版本信息
        id: build_version
        shell: bash
        run: |
          set -Eeuo pipefail
          # Compact local timestamp to the second; keep seconds to distinguish same-minute builds.
          # OTA compares this all-numeric version as a single numeric component.
          # Release tags use the readable "mylede-v<timestamp>" form.
          VERSION="$(TZ=Asia/Shanghai date +'%Y%m%d%H%M%S')"
          TAG="mylede-v${VERSION}"
          mkdir -p /home/ubuntu/files/etc/myupdate
          printf '%s\n' "$VERSION" > /home/ubuntu/files/etc/myupdate/build-version
          chmod 0644 /home/ubuntu/files/etc/myupdate/build-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "已写入 MyUpdate 版本信息：$VERSION（$TAG）"

      - name: 运行 01 至 04 号准备脚本及 06 号清理脚本
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          CHANGE_LAN_IP: ${{ inputs.change_lan_ip }}
          LAN_IP: ${{ inputs.lan_ip || '192.168.1.1' }}
          MYLEDE_SOURCE_LOCK: /home/ubuntu/source-revisions.tsv
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/ubuntu
          for script in \
            01-check-env.sh \
            02-update-source.sh \
            03-update-feeds.sh \
            04-configure.sh \
            06-clean-build.sh; do
            echo "========== 正在执行脚本：$script =========="
            bash "/home/ubuntu/scripts/$script"
            df -hT /
          done

      - name: 读取并显示已锁定 LEDE 源码中的分区默认值
        id: partition_defaults
        env:
          KERNEL_PARTSIZE: ${{ inputs.kernel_partsize || needs.source_check.outputs.last_kernel_partsize || '256' }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize || needs.source_check.outputs.last_rootfs_partsize || '4096' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          LEDE_DIR=/home/ubuntu/lede
          [[ -f "$LEDE_DIR/Makefile" ]] || { echo "::error::找不到已锁定版本的 LEDE Makefile：$LEDE_DIR"; exit 1; }
          cd "$LEDE_DIR"
          echo '========== 已锁定 LEDE 源码中的分区默认值 =========='
          # Parse the pinned LEDE Kconfig directly; printvars may enter
          # interactive menuconfig when .config does not exist yet.
          python3 - <<'PY'
          from pathlib import Path

          source = Path("config/Config-images.in")
          if not source.is_file():
              raise SystemExit(f"找不到 LEDE 分区默认值定义文件：{source}")

          lines = source.read_text(encoding="utf-8").splitlines()
          symbols = {
              "TARGET_KERNEL_PARTSIZE": "内核分区",
              "TARGET_ROOTFS_PARTSIZE": "根文件系统分区",
          }

          for symbol, label in symbols.items():
              start = next(
                  (i for i, line in enumerate(lines) if line.strip() == f"config {symbol}"),
                  None,
              )
              if start is None:
                  raise SystemExit(f"LEDE Kconfig 中未找到 {symbol}")

              defaults = []
              for offset, line in enumerate(lines[start + 1:], start + 2):
                  stripped = line.strip()
                  if stripped.startswith(("config ", "menuconfig ", "choice", "endchoice", "comment ", "source ")):
                      break
                  if not stripped.startswith("default "):
                      continue

                  expression = stripped[len("default "):]
                  value_text, separator, condition = expression.partition(" if ")
                  if not value_text.isdigit():
                      continue
                  defaults.append((int(value_text), condition if separator else None, offset, stripped))

              selected = next(
                  (item for item in defaults if item[1] and "TARGET_x86" in item[1].split()),
                  None,
              )
              if selected is None:
                  selected = next((item for item in defaults if item[1] is None), None)
              if selected is None:
                  raise SystemExit(f"无法从 {source} 解析 {symbol} 的默认值")

              value, condition, line_number, definition = selected
              scope = "TARGET_x86" if condition else "通用默认值"
              print(f"{label}：{value} MiB（{scope}，{source}:{line_number}）")
              print(f"  源码定义：{definition}")
              if symbol == "TARGET_KERNEL_PARTSIZE":
                  kernel_default = value
              else:
                  rootfs_default = value

          import os, re
          target_makefile = Path("target/linux/x86/Makefile")
          if not target_makefile.is_file():
              raise SystemExit(f"找不到 x86 target 定义文件：{target_makefile}")
          features = re.search(r"(?m)^FEATURES\s*[:+?]?=\s*(.*)$", target_makefile.read_text(encoding="utf-8"))
          if not features:
              raise SystemExit("无法从 target/linux/x86/Makefile 读取 FEATURES")
          uses_boot_part = "boot-part" in features.group(1).split()
          if not uses_boot_part:
              raise SystemExit("当前 x86 target 未启用 boot-part，无法安全生成 EFI 分区元数据")
          print(f"USES_BOOT_PART：{'启用' if uses_boot_part else '未启用'}（x86 FEATURES）")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"kernel_partsize={kernel_default}\n")
              stream.write(f"rootfs_partsize={rootfs_default}\n")
              stream.write(f"uses_boot_part={'true' if uses_boot_part else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("### x86 分区参数（本次锁定的 LEDE 源码）\n")
              stream.write(f"- 上游内核分区默认值：**{kernel_default} MiB**\n")
              stream.write(f"- 上游根文件系统分区默认值：**{rootfs_default} MiB**\n")
              stream.write(f"- USES_BOOT_PART：**{'启用' if uses_boot_part else '未启用'}**\n")
              stream.write(f"- 本次固件实际配置：内核 **{os.environ['KERNEL_PARTSIZE']} MiB**，根文件系统 **{os.environ['ROOTFS_PARTSIZE']} MiB**\n")
          PY
          echo '========== MyLEDE 请求的固件分区布局 =========='
          echo "内核分区：${KERNEL_PARTSIZE} MiB"
          echo "根文件系统分区：${ROOTFS_PARTSIZE} MiB"

      - name: 计算稳定的工具链缓存标识
        id: firmware_toolchain_key
        env:
          REBUILD_TOOLCHAIN: ${{ inputs.rebuild_toolchain }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CONFIG_HASH="$(sha256sum scripts/04-configure.sh .github/ci/install-build-deps.sh .github/ci/build-lede-cmake-host-tool.sh | sha256sum | awk '{print $1}')"
          MIXKEY="ubuntu-24.04-x86_64-${CONFIG_HASH}"
          if [[ "$REBUILD_TOOLCHAIN" == 'true' ]]; then
            MIXKEY="${MIXKEY}-forced-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "config_hash=$CONFIG_HASH" >> "$GITHUB_OUTPUT"
          echo "mixkey=$MIXKEY" >> "$GITHUB_OUTPUT"

      - name: 恢复主机工具与交叉编译工具链缓存
        id: firmware_toolchain_cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: false
          toolchain: true
          skip: true
          clean: false
          prefix: /home/ubuntu/lede
          mixkey: ${{ steps.firmware_toolchain_key.outputs.mixkey }}

      - name: 从 Release 备用缓存恢复工具链
        id: firmware_release_fallback
        if: steps.firmware_toolchain_cache.outputs.hit != '1'
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          TOOLCHAIN_MIXKEY: ${{ steps.firmware_toolchain_key.outputs.mixkey }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TOOLCHAIN_HASH="$(git -C /home/ubuntu/lede log --pretty=tformat:%h -n1 tools toolchain)"
          ASSET_NAME="toolchain-${TOOLCHAIN_MIXKEY}-${TOOLCHAIN_HASH}.tar.zst"
          if gh release download toolchain-cache --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP"; then
            tar --zstd -xf "$RUNNER_TEMP/$ASSET_NAME" -C /home/ubuntu/lede
            sed -i 's/ $(tool.*\/stamp-compile)//;' /home/ubuntu/lede/Makefile
            sed -i 's/ $(tool.*\/stamp-install)//;' /home/ubuntu/lede/Makefile
            echo 'hit=1' >> "$GITHUB_OUTPUT"
            echo '已从 Release 备用缓存恢复工具链。'
          else
            echo 'hit=0' >> "$GITHUB_OUTPUT"
            echo '未找到工具链 Release 备用缓存。'
          fi

      - name: 验证工具链缓存是否可用
        shell: bash
        env:
          ACTIONS_CACHE_HIT: ${{ steps.firmware_toolchain_cache.outputs.hit }}
          RELEASE_CACHE_HIT: ${{ steps.firmware_release_fallback.outputs.hit }}
        run: |
          set -Eeuo pipefail
          if [[ "$ACTIONS_CACHE_HIT" != '1' && "$RELEASE_CACHE_HIT" != '1' ]]; then
            echo '::error::固件编译任务中缺少工具链缓存。独立的工具链任务本应生成该缓存；为避免再次进行数小时的冷编译，现停止执行。'
            exit 1
          fi
          echo '工具链缓存已就绪。'
          du -sh /home/ubuntu/lede/staging_dir/host* /home/ubuntu/lede/staging_dir/tool* 2>/dev/null || true
          df -hT /

      - name: 运行 tools/install 和 07 号编译脚本并监控磁盘空间
        id: firmware_build
        env:
          KERNEL_PARTSIZE: ${{ inputs.kernel_partsize || needs.source_check.outputs.last_kernel_partsize || '256' }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize || needs.source_check.outputs.last_rootfs_partsize || '4096' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/ubuntu

          if ! grep -q 'make V=s -j' scripts/07-build.sh; then
            echo '::error::在 scripts/07-build.sh 中未找到预期的 make V=s 命令。'
            exit 1
          fi
          # Modify only this disposable Runner copy: lower log verbosity for CI; keep the committed script unchanged.
          sed -i 's/make V=s -j/make V=1 -j/' scripts/07-build.sh

          cat > "$RUNNER_TEMP/run-firmware-build.sh" <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          cd /home/ubuntu/lede
          make defconfig
          # Build CMake serially before tools/install can schedule dwarves in parallel.
          bash "$GITHUB_WORKSPACE/.github/ci/build-lede-cmake-host-tool.sh"
          # The cached host/toolchain tree may not contain every config-dependent host utility.
          make V=1 -j"$(nproc)" tools/install
          # Keep the original script's semantics: it removes tmp/.config, runs defconfig, then builds.
          cd /home/ubuntu
          bash /home/ubuntu/scripts/07-build.sh
          grep -Fxq "CONFIG_TARGET_KERNEL_PARTSIZE=${KERNEL_PARTSIZE}" /home/ubuntu/lede/.config || {
            echo "::error::最终 .config 未包含所要求的 ${KERNEL_PARTSIZE} MB 内核分区。"
            exit 1
          }
          grep -Fxq "CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE}" /home/ubuntu/lede/.config || {
            echo "::error::最终 .config 未包含所要求的 ${ROOTFS_PARTSIZE} MB 根文件系统分区。"
            exit 1
          }
          echo "已验证分区布局：内核=${KERNEL_PARTSIZE} MB，根文件系统=${ROOTFS_PARTSIZE} MB。"
          BUILD_SCRIPT
          chmod +x "$RUNNER_TEMP/run-firmware-build.sh"

          BUILD_LOG="$RUNNER_TEMP/lede-firmware-build.log"
          setsid bash -o pipefail -c \
            'timeout --signal=INT --kill-after=30s 300m "$1" 2>&1 | tee "$2"' \
            _ "$RUNNER_TEMP/run-firmware-build.sh" "$BUILD_LOG" &
          BUILD_PID=$!
          BUILD_PGID="$(ps -o pgid= -p "$BUILD_PID" | tr -d ' ')"
          [[ -n "$BUILD_PGID" ]] || { echo '::error::无法识别固件编译进程组。'; exit 1; }

          (
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              sleep 60
              kill -0 "$BUILD_PID" 2>/dev/null || exit 0
              AVAILABLE_KB="$(df -Pk / | awk 'NR == 2 {print $4}')"
              AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
              echo "固件编译磁盘监控：剩余 ${AVAILABLE_GB} GiB。"
              if (( AVAILABLE_KB < 5 * 1024 * 1024 )); then
                echo "::error::磁盘空间不足，固件编译已提前停止；当前仅剩 ${AVAILABLE_GB} GiB。"
                kill -TERM -- "-$BUILD_PGID" 2>/dev/null || true
                sleep 20
                kill -KILL -- "-$BUILD_PGID" 2>/dev/null || true
                exit 0
              fi
            done
          ) &
          WATCHDOG_PID=$!

          set +e
          wait "$BUILD_PID"
          BUILD_STATUS=$?
          set -e
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          echo '========== 固件编译后的磁盘空间 =========='
          df -hT /
          exit "$BUILD_STATUS"

      - name: 编译失败时上传固件编译日志
        if: always() && steps.firmware_build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: 固件编译日志-${{ github.run_number }}
          path: ${{ runner.temp }}/lede-firmware-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 记录本次编译使用的精确源码版本
        id: plugin_source_revisions
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lock_file = Path("/home/ubuntu/source-revisions.tsv")
          if not lock_file.is_file():
              raise SystemExit(f"immutable source lock file is missing: {lock_file}")

          # Read the same immutable commit locks that were resolved before the
          # build and used by the package Makefiles. Never infer a full SHA from
          # shortened archive names in dl/.
          locked = {}
          for line in lock_file.read_text(encoding="utf-8").splitlines():
              fields = line.split("\t")
              if len(fields) != 4:
                  raise SystemExit(f"invalid source lock row: {line!r}")
              name, url, ref, commit = fields
              # Git source revisions are 40-character commit IDs. The minisign
              # release entry is different: its fourth column stores the SHA-256
              # digest of the downloaded source archive (64 hexadecimal chars).
              expected_length = 64 if name == "MINISIGN_RELEASE" else 40
              if not re.fullmatch(rf"[0-9a-f]{{{expected_length}}}", commit):
                  kind = "SHA-256 digest" if name == "MINISIGN_RELEASE" else "Git commit SHA"
                  raise SystemExit(f"invalid {kind} in source lock for {name}: {commit!r}")
              if name in locked:
                  raise SystemExit(f"duplicate source lock entry: {name}")
              locked[name] = (url, ref, commit)

          expected = {
              "lede_commit": "LEDE",
              "smartdns": "plugin:smartdns",
              "smartdns_webui": "plugin:smartdns_webui",
              "luci_app_smartdns": "plugin:luci_app_smartdns",
              "openclash_commit": "feed:OpenClash",
          }
          outputs = {}
          for output_name, lock_name in expected.items():
              if lock_name not in locked:
                  raise SystemExit(f"source lock is missing required entry: {lock_name}")
              url, ref, commit = locked[lock_name]
              if not url.startswith("https://github.com/"):
                  raise SystemExit(f"unexpected non-GitHub source URL for {lock_name}: {url}")
              outputs[output_name] = commit
              outputs[f"{output_name}_url"] = url
              outputs[f"{output_name}_ref"] = ref
              print(f"{output_name}: {commit} ({url}, locked ref: {ref})")

          outputs["lede_url"] = locked["LEDE"][0]
          outputs["lede_ref"] = locked["LEDE"][1]
          if "MINISIGN_RELEASE" not in locked:
              raise SystemExit("source lock is missing MINISIGN_RELEASE metadata")
          minisign_url, minisign_version, minisign_sha256 = locked["MINISIGN_RELEASE"]
          if not re.fullmatch(r"v?(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))+(?:\.(0|[1-9][0-9]*))*", minisign_version):
              raise SystemExit(f"invalid locked Minisign version: {minisign_version!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", minisign_sha256):
              raise SystemExit(f"invalid locked Minisign archive SHA-256: {minisign_sha256!r}")
          outputs["minisign_url"] = minisign_url
          outputs["minisign_version"] = minisign_version
          outputs["minisign_sha256"] = minisign_sha256
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for name, value in outputs.items():
                  stream.write(f"{name}={value}\n")
          PY
      - name: 选择 UEFI 镜像并准备发布文件
        if: success()
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.build_version.outputs.version }}
          BUILD_TAG: ${{ steps.build_version.outputs.tag }}
          SOURCE_FINGERPRINT: ${{ needs.source_check.outputs.fingerprint }}
          LEDE_COMMIT: ${{ steps.plugin_source_revisions.outputs.lede_commit }}
          LEDE_REF: ${{ steps.plugin_source_revisions.outputs.lede_ref }}
          LEDE_SOURCE_URL: ${{ steps.plugin_source_revisions.outputs.lede_url }}
          SMARTDNS_COMMIT: ${{ steps.plugin_source_revisions.outputs.smartdns }}
          SMARTDNS_SOURCE_URL: ${{ steps.plugin_source_revisions.outputs.smartdns_url }}
          SMARTDNS_SOURCE_REF: ${{ steps.plugin_source_revisions.outputs.smartdns_ref }}
          SMARTDNS_WEBUI_COMMIT: ${{ steps.plugin_source_revisions.outputs.smartdns_webui }}
          SMARTDNS_WEBUI_SOURCE_URL: ${{ steps.plugin_source_revisions.outputs.smartdns_webui_url }}
          SMARTDNS_WEBUI_SOURCE_REF: ${{ steps.plugin_source_revisions.outputs.smartdns_webui_ref }}
          LUCI_APP_SMARTDNS_COMMIT: ${{ steps.plugin_source_revisions.outputs.luci_app_smartdns }}
          LUCI_APP_SMARTDNS_SOURCE_URL: ${{ steps.plugin_source_revisions.outputs.luci_app_smartdns_url }}
          LUCI_APP_SMARTDNS_SOURCE_REF: ${{ steps.plugin_source_revisions.outputs.luci_app_smartdns_ref }}
          OPENCLASH_COMMIT: ${{ steps.plugin_source_revisions.outputs.openclash_commit }}
          OPENCLASH_SOURCE_URL: ${{ steps.plugin_source_revisions.outputs.openclash_commit_url }}
          OPENCLASH_SOURCE_REF: ${{ steps.plugin_source_revisions.outputs.openclash_commit_ref }}
          MINISIGN_SOURCE_URL: ${{ steps.plugin_source_revisions.outputs.minisign_url }}
          MINISIGN_VERSION: ${{ steps.plugin_source_revisions.outputs.minisign_version }}
          MINISIGN_SHA256: ${{ steps.plugin_source_revisions.outputs.minisign_sha256 }}
          BUILD_TARGET: x86_64
          KERNEL_PARTSIZE: ${{ inputs.kernel_partsize || needs.source_check.outputs.last_kernel_partsize || '256' }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize || needs.source_check.outputs.last_rootfs_partsize || '4096' }}
          UPSTREAM_KERNEL_PARTSIZE: ${{ steps.partition_defaults.outputs.kernel_partsize }}
          UPSTREAM_ROOTFS_PARTSIZE: ${{ steps.partition_defaults.outputs.rootfs_partsize }}
          USES_BOOT_PART: ${{ steps.partition_defaults.outputs.uses_boot_part }}
        run: |
          set -Eeuo pipefail
          TARGET_DIR=/home/ubuntu/lede/bin/targets/x86/64
          RELEASE_INPUT="$GITHUB_WORKSPACE/release-input"
          mkdir -p "$RELEASE_INPUT"
          [[ -d "$TARGET_DIR" ]] || { echo "::error::找不到目标输出目录：$TARGET_DIR"; exit 1; }

          mapfile -t IMAGES < <(find "$TARGET_DIR" -maxdepth 1 -type f \
            -name 'openwrt-x86-64-generic-squashfs-combined-efi.img.gz' -print | sort)
          if (( ${#IMAGES[@]} != 1 )); then
            echo "::error::预期应生成一个 EFI 合并镜像，实际找到 ${#IMAGES[@]} 个。"
            find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort || true
            exit 1
          fi

          cp -f "${IMAGES[0]}" "$RELEASE_INPUT/"
          cp -f "$TARGET_DIR/version.buildinfo" "$RELEASE_INPUT/version.buildinfo"
          python3 - "$RELEASE_INPUT/build-meta.json" "$BUILD_VERSION" "$BUILD_TAG" "$SOURCE_FINGERPRINT" "$LEDE_COMMIT" "$GITHUB_SHA" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          output, version, tag, fingerprint, lede_commit, mylede_commit = sys.argv[1:]
          final_config = Path('/home/ubuntu/lede/.config')
          if not final_config.is_file():
              raise SystemExit('最终 LEDE .config 不存在，不能记录固件分区布局')
          config_values = {}
          for line in final_config.read_text(encoding='utf-8').splitlines():
              match = re.fullmatch(r'CONFIG_TARGET_(KERNEL|ROOTFS)_PARTSIZE=(\d+)', line)
              if match:
                  config_values[match.group(1)] = int(match.group(2))
          if set(config_values) != {'KERNEL', 'ROOTFS'}:
              raise SystemExit(f'最终 .config 缺少分区大小：{config_values!r}')
          if config_values['KERNEL'] != int(os.environ['KERNEL_PARTSIZE']) or config_values['ROOTFS'] != int(os.environ['ROOTFS_PARTSIZE']):
              raise SystemExit(f'最终 .config 分区大小与 Actions 输入不一致：{config_values!r}')
          sources = {
              'smartdns': os.environ['SMARTDNS_COMMIT'],
              'smartdns_webui': os.environ['SMARTDNS_WEBUI_COMMIT'],
              'luci_app_smartdns': os.environ['LUCI_APP_SMARTDNS_COMMIT'],
              'openclash': os.environ['OPENCLASH_COMMIT'],
          }
          source_repositories = {
              'lede': {'url': os.environ['LEDE_SOURCE_URL'], 'ref': os.environ['LEDE_REF'], 'commit': lede_commit},
              'smartdns': {'url': os.environ['SMARTDNS_SOURCE_URL'], 'ref': os.environ['SMARTDNS_SOURCE_REF'], 'commit': sources['smartdns']},
              'smartdns_webui': {'url': os.environ['SMARTDNS_WEBUI_SOURCE_URL'], 'ref': os.environ['SMARTDNS_WEBUI_SOURCE_REF'], 'commit': sources['smartdns_webui']},
              'luci_app_smartdns': {'url': os.environ['LUCI_APP_SMARTDNS_SOURCE_URL'], 'ref': os.environ['LUCI_APP_SMARTDNS_SOURCE_REF'], 'commit': sources['luci_app_smartdns']},
              'openclash': {'url': os.environ['OPENCLASH_SOURCE_URL'], 'ref': os.environ['OPENCLASH_SOURCE_REF'], 'commit': sources['openclash']},
          }
          for name, commit in sources.items():
              if not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise SystemExit(f'Invalid full source commit SHA for {name}: {commit!r}')
          if not re.fullmatch(r'[0-9a-f]{40}', lede_commit):
              raise SystemExit(f'Invalid full LEDE commit SHA: {lede_commit!r}')
          with open(output, 'w', encoding='utf-8') as f:
              json.dump({
                  'version': version,
                  'tag': tag,
                  'source_fingerprint': fingerprint,
                  'lede_commit': lede_commit,
                  'lede_ref': os.environ['LEDE_REF'],
                  'mylede_commit': mylede_commit,
                  'sources': sources,
                  'source_repositories': source_repositories,
                  'minisign_release': {
                      'url': os.environ['MINISIGN_SOURCE_URL'],
                      'version': os.environ['MINISIGN_VERSION'],
                      'sha256': os.environ['MINISIGN_SHA256'],
                  },
                  'partition_layout': {
                      'kernel_partsize_mib': config_values['KERNEL'],
                      'rootfs_partsize_mib': config_values['ROOTFS'],
                      'uses_boot_part': os.environ['USES_BOOT_PART'].lower() == 'true',
                      'upstream_defaults_mib': {
                          'kernel_partsize': int(os.environ['UPSTREAM_KERNEL_PARTSIZE']),
                          'rootfs_partsize': int(os.environ['UPSTREAM_ROOTFS_PARTSIZE'])
                      }
                  },
                  'build_target': os.environ.get('BUILD_TARGET', 'x86_64'),
                  # This workflow builds only the LEDE x86/64 target.
                  # Keep release compatibility metadata explicit instead of
                  # depending on optional fields in version.buildinfo.
                  'compatibility': {
                      'target': 'x86',
                      'subtarget': '64',
                      'arch': 'x86_64'
                  }
              }, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          echo '待发布文件：'
          find "$RELEASE_INPUT" -maxdepth 1 -type f -printf '%f (%s bytes)\n'

      - name: 上传固件供独立发布任务使用
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: 固件发布文件
          path: release-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 保存新快照前清理过期的 LEDE 下载缓存
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          KEEP_TOOLCHAIN_KEY: lede-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --key "lede-dl-${RUNNER_OS}-" \
            --limit 100 --json id,key,lastAccessedAt > "$RUNNER_TEMP/dl-caches.json"
          python3 - "$RUNNER_TEMP/dl-caches.json" "$KEEP_TOOLCHAIN_KEY" <<'PY' > "$RUNNER_TEMP/delete-dl-cache-ids.txt"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          keep = {sys.argv[2]}
          old = sorted(data, key=lambda x: x.get('lastAccessedAt') or '', reverse=True)
          if old:
              keep.add(old[0].get('key'))
          for item in data:
              if item.get('key') not in keep:
                  print(item['id'])
          PY
          while IFS= read -r cache_id; do
            [[ -n "$cache_id" ]] || continue
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY" || true
          done < "$RUNNER_TEMP/delete-dl-cache-ids.txt"

      - name: 保存更新后的 LEDE 下载缓存
        if: success()
        id: save_dl_cache
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: /home/ubuntu/dl
          key: lede-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-full

      - name: 成功保存后清理旧版 LEDE 下载缓存快照
        if: success() && steps.save_dl_cache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          KEEP_KEY: lede-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-full
        shell: bash
        run: |
          set -Eeuo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --key "lede-dl-${RUNNER_OS}-" \
            --limit 100 --json id,key > "$RUNNER_TEMP/dl-caches-after-save.json"
          python3 - "$RUNNER_TEMP/dl-caches-after-save.json" "$KEEP_KEY" <<'PY' > "$RUNNER_TEMP/delete-dl-cache-ids-after-save.txt"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          keep = sys.argv[2]
          for item in data:
              if item.get('key') != keep:
                  print(item['id'])
          PY
          while IFS= read -r cache_id; do
            [[ -n "$cache_id" ]] || continue
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY" || true
          done < "$RUNNER_TEMP/delete-dl-cache-ids-after-save.txt"

      - name: 清理过期的工具链缓存键
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          MIXKEY: ${{ steps.firmware_toolchain_key.outputs.mixkey }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT_KEY="${MIXKEY}-cache-openwrt-$(git -C /home/ubuntu/lede log --pretty=tformat:%h -n1 tools toolchain)"
          gh cache list --repo "$GITHUB_REPOSITORY" --key 'ubuntu-24.04-' \
            --limit 100 --json id,key > "$RUNNER_TEMP/toolchain-caches.json"
          python3 - "$RUNNER_TEMP/toolchain-caches.json" "$CURRENT_KEY" <<'PY' > "$RUNNER_TEMP/delete-toolchain-cache-ids.txt"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          keep = sys.argv[2]
          for item in data:
              if item.get('key') != keep:
                  print(item['id'])
          PY
          while IFS= read -r cache_id; do
            [[ -n "$cache_id" ]] || continue
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY" || true
          done < "$RUNNER_TEMP/delete-toolchain-cache-ids.txt"

  publish:
    name: 构建任务三：签名清单并发布 GitHub 固件
    needs: [source_check, firmware]
    if: needs.source_check.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: 检出仓库以读取保留策略默认值
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
          # Use the repository PAT for the post-release commit that updates this workflow.
          # The token must have Contents: read/write and Workflows: read/write.
          token: ${{ secrets.PERSON_TOKEN }}

      - name: 下载待发布的固件文件
        uses: actions/download-artifact@v7
        with:
          name: 固件发布文件
          path: release-input

      - name: 安装 minisign 签名工具
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y minisign
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: 生成发布清单与 SHA256 校验值
        id: release_meta
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - release-input/version.buildinfo release-input/build-meta.json release-input/manifest.json <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path

          info_path, meta_path, manifest_path = map(Path, sys.argv[1:])
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          info_values = {}
          for line in info_path.read_text(errors='replace').splitlines():
              match = re.match(r"^([A-Z0-9_]+)=(?:'([^']*)'|\"([^\"]*)\"|(.*))$", line.strip())
              if match:
                  info_values[match.group(1)] = next((v for v in match.groups()[1:] if v is not None), '')

          # The build workflow is intentionally fixed to LEDE x86/64.
          # Read compatibility from build-meta.json, which we generate ourselves,
          # rather than relying on version.buildinfo to contain optional fields.
          compatibility = meta.get('compatibility') or {}
          target = compatibility.get('target', '')
          subtarget = compatibility.get('subtarget', '')
          arch = compatibility.get('arch', '')

          expected = {'target': 'x86', 'subtarget': '64', 'arch': 'x86_64'}
          actual = {'target': target, 'subtarget': subtarget, 'arch': arch}
          if actual != expected:
              raise SystemExit(
                  'Invalid firmware compatibility metadata: '
                  f'expected={expected!r}, actual={actual!r}'
              )

          # If version.buildinfo does contain compatibility fields, make sure
          # they agree with the fixed target; missing fields are not fatal.
          info_target = info_values.get('DISTRIB_TARGET', '').strip()
          info_arch = info_values.get('DISTRIB_ARCH', '').strip()
          if info_target and info_target != f'{target}/{subtarget}':
              raise SystemExit(
                  f'version.buildinfo target mismatch: {info_target!r} '
                  f'!= {target}/{subtarget}'
              )
          if info_arch and info_arch != arch:
              raise SystemExit(
                  f'version.buildinfo arch mismatch: {info_arch!r} != {arch}'
              )

          images = list(Path('release-input').glob('openwrt-x86-64-generic-squashfs-combined-efi.img.gz'))
          if len(images) != 1 or images[0].stat().st_size == 0:
              raise SystemExit('Expected exactly one non-empty combined EFI image.')
          if target != 'x86' or subtarget != '64' or arch != 'x86_64':
              raise SystemExit('Firmware image and compatibility target do not match.')
          image = images[0]
          digest = hashlib.sha256()
          with image.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)

          sources = {}
          for source in meta['source_repositories'].values():
              url = source['url']
              match = re.fullmatch(r'https://github\.com/([^/]+/[^/]+?)(?:\.git)?', url)
              if not match:
                  raise SystemExit(f'Invalid locked GitHub repository URL in build metadata: {url!r}')
              repository = match.group(1)
              commit = source['commit']
              ref = source['ref']
              if not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise SystemExit(f'Invalid full source commit SHA for {repository}: {commit!r}')
              display_ref = ref.removeprefix('refs/heads/') if ref.startswith('refs/heads/') else ref
              sources[repository] = {
                  'ref': f'{display_ref} (preflight-locked)',
                  'commit': commit,
                  'short_commit': commit[:7],
              }
          manifest = {
              'schema_version': 2,
              'version': meta['version'],
              'tag': meta['tag'],
              'channel': 'stable',
              'sources': sources,
              'source_repositories': meta['source_repositories'],
              'minisign_release': meta['minisign_release'],
              'partition_layout': meta['partition_layout'],
              'compatibility': {
                  'target': target,
                  'subtarget': subtarget,
                  'arch': arch,
                  'device_policy': 'target',
                  'devices': []
              },
              'image': {
                  'asset': image.name,
                  'sha256': digest.hexdigest(),
                  'size': image.stat().st_size
              }
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          print(f"version={meta['version']}")
          print(f"tag={meta['tag']}")
          PY
          META="$(cat release-input/build-meta.json)"
          VERSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<< "$META")"
          TAG="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])' <<< "$META")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 使用 minisign 对发布清单进行签名
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${MINISIGN_SECRET_KEY:-}" ]]; then
            echo '::error::仓库尚未配置 MINISIGN_SECRET_KEY 密钥。'
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          minisign -S -W -s "$KEY_FILE" \
            -m "$GITHUB_WORKSPACE/release-input/manifest.json" \
            -x "$GITHUB_WORKSPACE/release-input/manifest.minisig" \
            -t 'MyLEDE firmware release'
          rm -f "$KEY_FILE"

      - name: 验证已签名的 OTA 发布文件
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$(find release-input -maxdepth 1 -type f -name 'openwrt-x86-64-generic-squashfs-combined-efi.img.gz' -print -quit)"
          [[ -n "$IMAGE" ]] || { echo '::error::缺少 OTA 测试镜像。'; exit 1; }
          python3 tests/ota/validate_release.py release-input/manifest.json "$IMAGE"

      - name: 发布固件版本
        env:
          GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$(find release-input -maxdepth 1 -type f -name 'openwrt-x86-64-generic-squashfs-combined-efi.img.gz' -print -quit)"
          [[ -n "$IMAGE" ]] || { echo '::error::发布文件中缺少固件镜像。'; exit 1; }
          META="$(cat release-input/build-meta.json)"
          LEDE_COMMIT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["lede_commit"])' <<< "$META")"
          LEDE_REPO="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["source_repositories"]["lede"]["url"].removeprefix("https://github.com/").removesuffix(".git"))' <<< "$META")"
          SMARTDNS_REPO="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["source_repositories"]["smartdns"]["url"].removeprefix("https://github.com/").removesuffix(".git"))' <<< "$META")"
          SMARTDNS_WEBUI_REPO="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["source_repositories"]["smartdns_webui"]["url"].removeprefix("https://github.com/").removesuffix(".git"))' <<< "$META")"
          LUCI_APP_SMARTDNS_REPO="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["source_repositories"]["luci_app_smartdns"]["url"].removeprefix("https://github.com/").removesuffix(".git"))' <<< "$META")"
          OPENCLASH_REPO="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["source_repositories"]["openclash"]["url"].removeprefix("https://github.com/").removesuffix(".git"))' <<< "$META")"
          SMARTDNS_COMMIT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sources"]["smartdns"])' <<< "$META")"
          SMARTDNS_WEBUI_COMMIT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sources"]["smartdns_webui"])' <<< "$META")"
          LUCI_APP_SMARTDNS_COMMIT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sources"]["luci_app_smartdns"])' <<< "$META")"
          OPENCLASH_COMMIT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sources"]["openclash"])' <<< "$META")"
          MINISIGN_VERSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["minisign_release"]["version"])' <<< "$META")"
          MINISIGN_SHA256="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["minisign_release"]["sha256"])' <<< "$META")"
          # Read effective partition sizes from the exact manifest that will be signed
          # and published; do not reconstruct them from workflow inputs or defaults.
          mapfile -t PARTITION_VALUES < <(python3 - release-input/manifest.json <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          layout = manifest.get("partition_layout") or {}
          upstream = layout.get("upstream_defaults_mib") or {}
          values = [
              layout.get("kernel_partsize_mib"),
              layout.get("rootfs_partsize_mib"),
              upstream.get("kernel_partsize"),
              upstream.get("rootfs_partsize"),
          ]
          if any(not isinstance(value, int) or isinstance(value, bool) or value <= 0 for value in values):
              raise SystemExit(f"Manifest 分区布局字段无效：{values!r}")
          for value in values:
              print(value)
          PY
          )
          if (( ${#PARTITION_VALUES[@]} != 4 )); then
            echo "::error::无法从 Manifest 读取完整的实际分区大小和上游默认值。"
            exit 1
          fi
          KERNEL_PARTSIZE="${PARTITION_VALUES[0]}"
          ROOTFS_PARTSIZE="${PARTITION_VALUES[1]}"
          UPSTREAM_KERNEL_PARTSIZE="${PARTITION_VALUES[2]}"
          UPSTREAM_ROOTFS_PARTSIZE="${PARTITION_VALUES[3]}"

          cat > release-input/release-notes.md <<EOF
          MyLEDE x86-64 固件自动编译发布。

          - 固件版本：${RELEASE_VERSION}
          - 固件文件：$(basename "$IMAGE")
          - 发布清单：manifest.json
          - 清单签名：manifest.minisig

          ### 本次固件分区布局

          - 本次固件内核分区大小：${KERNEL_PARTSIZE} MiB
          - 本次固件根文件系统分区大小：${ROOTFS_PARTSIZE} MiB
          - 上游源码默认值：内核 ${UPSTREAM_KERNEL_PARTSIZE} MiB，根文件系统 ${UPSTREAM_ROOTFS_PARTSIZE} MiB

          ### 本次编译使用的源码版本

          - Minisign：${MINISIGN_VERSION}（归档 SHA-256：${MINISIGN_SHA256}）
          - LEDE: [${LEDE_COMMIT:0:7}](https://github.com/${LEDE_REPO}/commit/${LEDE_COMMIT})
          - SmartDNS: [${SMARTDNS_COMMIT:0:7}](https://github.com/${SMARTDNS_REPO}/commit/${SMARTDNS_COMMIT})
          - SmartDNS WebUI: [${SMARTDNS_WEBUI_COMMIT:0:7}](https://github.com/${SMARTDNS_WEBUI_REPO}/commit/${SMARTDNS_WEBUI_COMMIT})
          - LuCI App SmartDNS: [${LUCI_APP_SMARTDNS_COMMIT:0:7}](https://github.com/${LUCI_APP_SMARTDNS_REPO}/commit/${LUCI_APP_SMARTDNS_COMMIT})
          - OpenClash: [${OPENCLASH_COMMIT:0:7}](https://github.com/${OPENCLASH_REPO}/commit/${OPENCLASH_COMMIT})
          EOF
          # The GITHUB_TOKEN cannot create a release tag targeting a commit
          # that changes workflow files relative to the default branch. Ensure
          # this build still matches main, then let the Releases API use the
          # default branch head (without an explicit target_commitish).
          DEFAULT_BRANCH_SHA="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ -z "$DEFAULT_BRANCH_SHA" || "$DEFAULT_BRANCH_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::发布前 main 分支已发生变化，或本次运行并非基于 main 最新提交。为避免发布错误源码版本，已停止创建 Release。"
            echo "构建提交：$GITHUB_SHA"
            echo "当前 main：${DEFAULT_BRANCH_SHA:-无法获取}"
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "$IMAGE" \
            release-input/manifest.json \
            release-input/manifest.minisig \
            --repo "$GITHUB_REPOSITORY" \
            --title "MyLEDE ${RELEASE_VERSION}" \
            --notes-file release-input/release-notes.md \
            --latest

      - name: 保存本次成功固件分区值，更新下次编译默认值和表单提示
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::成功固件只允许从 main 分支发布，拒绝将分区默认值写入其他分支。"
            exit 1
          }
          python3 scripts/update-build-partition-defaults.py \
            release-input/manifest.json \
            build-config/last-successful-partition-layout.json \
            .github/workflows/build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-config/last-successful-partition-layout.json .github/workflows/build.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci(build): remember last successful firmware partition layout"
            git push origin "HEAD:${GITHUB_REF}"
          else
            echo "本次分区值与持久化默认值相同，无需提交更新。"
          fi

      - name: 准备成功编译的源码指纹标记
        env:
          SOURCE_FINGERPRINT: ${{ needs.source_check.outputs.fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lede-build-state"
          printf '%s\n' "$SOURCE_FINGERPRINT" > "$RUNNER_TEMP/lede-build-state/successful-source-fingerprint.txt"

      - name: 保存成功编译的源码指纹
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/lede-build-state
          key: lede-success-${{ needs.source_check.outputs.fingerprint }}-${{ github.sha }}
