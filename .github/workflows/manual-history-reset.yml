name: Repository History and Retention Maintenance

on:
  schedule:
    # 每天北京时间 03:00（UTC 前一天 19:00）执行历史保留清理。
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      keep_days:
        description: '历史保留天数（适用于全部 workflow runs 和正式 Releases）'
        required: true
        default: '7'
        type: string
      keep_count:
        description: '至少保留的最新记录数量（适用于全部 workflow runs 和正式 Releases）'
        required: true
        default: '30'
        type: string
      confirm_reset:
        description: "是否将仓库所有分支历史重置为各自当前文件快照？此操作不可逆。"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      confirmation_text:
        description: '只有选择 yes 时，才输入：DELETE ALL BRANCH COMMITS'
        required: false
        type: string
      archive_closed_prs:
        description: "是否同时归档所有已关闭/已合并的历史 PR（普通访客将看到 404）？"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      archive_confirmation:
        description: '只有选择 yes 时，才输入：ARCHIVE CLOSED PULL REQUESTS'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: repository-history-maintenance
  cancel-in-progress: false

jobs:
  cleanup-retention:
    name: Clean all workflow runs and Releases
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_KEEP_DAYS: ${{ inputs.keep_days }}
      INPUT_KEEP_COUNT: ${{ inputs.keep_count }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Clean old Releases and all workflow runs
        shell: bash
        run: |
          set -Eeuo pipefail
          KEEP_DAYS="${INPUT_KEEP_DAYS:-7}"
          KEEP_COUNT="${INPUT_KEEP_COUNT:-30}"
          [[ "$KEEP_DAYS" =~ ^[1-9][0-9]*$ ]] || { echo '::error::保留天数必须是正整数。'; exit 1; }
          [[ "$KEEP_COUNT" =~ ^[1-9][0-9]*$ ]] || { echo '::error::保留数量必须是正整数。'; exit 1; }
          CUTOFF="$(date -u -d "$KEEP_DAYS days ago" +%s)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name, (.published_at // ""), (.prerelease | tostring)] | @tsv' > "$RUNNER_TEMP/all-releases.tsv"
          python3 - "$RUNNER_TEMP/all-releases.tsv" "$CUTOFF" "$KEEP_COUNT" <<'PY' > "$RUNNER_TEMP/old-release-tags.txt"
          import datetime, sys
          path, cutoff, keep_count = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          items=[]
          with open(path, encoding='utf-8') as f:
              for line in f:
                  tag, published, prerelease = line.rstrip('\n').split('\t')
                  if not tag or not published or prerelease == 'true' or tag == 'toolchain-cache': continue
                  dt=datetime.datetime.fromisoformat(published.replace('Z','+00:00'))
                  items.append((dt.timestamp(), tag))
          items.sort(reverse=True)
          kept=0
          for timestamp, tag in items:
              if kept == 0 or (timestamp >= cutoff and kept < keep_count): kept += 1
              else: print(tag)
          PY
          RELEASE_DELETED=0
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            RELEASE_DELETED=$((RELEASE_DELETED + 1))
          done < "$RUNNER_TEMP/old-release-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id, .created_at, .status] | @tsv' > "$RUNNER_TEMP/all-workflow-runs.tsv"
          python3 - "$RUNNER_TEMP/all-workflow-runs.tsv" "$CUTOFF" "$KEEP_COUNT" "$CURRENT_RUN_ID" <<'PY' > "$RUNNER_TEMP/old-run-ids.txt"
          import datetime, sys
          path, cutoff, keep_count, current_id = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          runs=[]
          with open(path, encoding='utf-8') as f:
              for line in f:
                  run_id, created, status = line.rstrip('\n').split('\t')
                  if run_id and status == 'completed' and run_id != current_id:
                      stamp=datetime.datetime.fromisoformat(created.replace('Z','+00:00')).timestamp()
                      runs.append((stamp, run_id))
          runs.sort(reverse=True)
          kept=0
          for stamp, run_id in runs:
              if stamp >= cutoff and kept < keep_count: kept += 1
              else: print(run_id)
          PY
          RUN_DELETED=0
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh run delete "$run_id" --repo "$GITHUB_REPOSITORY"
            RUN_DELETED=$((RUN_DELETED + 1))
          done < "$RUNNER_TEMP/old-run-ids.txt"
          {
            echo '## 全仓库历史清理结果'
            echo "- 保留天数：$KEEP_DAYS 天"
            echo "- 最少保留数量：$KEEP_COUNT 条"
            echo "- 删除正式 Releases：$RELEASE_DELETED 个"
            echo "- 删除所有 workflows 的已完成运行记录：$RUN_DELETED 条"
            echo '- 保留 toolchain-cache、预发布 Releases、当前清理运行及未完成的 Actions runs。'
          } >> "$GITHUB_STEP_SUMMARY"

  archive-closed-prs:
    name: Archive closed historical pull requests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_closed_prs == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      # archivePullRequest requires the token owner to have at least Triage access.
      # Configure PERSON_TOKEN as a repository Actions secret (fine-grained PAT).
      GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
    steps:
      - name: Validate archive confirmation
        shell: bash
        env:
          ARCHIVE_CONFIRMATION: ${{ inputs.archive_confirmation }}
        run: |
          set -euo pipefail
          if [[ "$ARCHIVE_CONFIRMATION" != "ARCHIVE CLOSED PULL REQUESTS" ]]; then
            echo "::error::PR 归档二次确认不匹配。必须准确输入 ARCHIVE CLOSED PULL REQUESTS。"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::请从 main 分支手动运行此 workflow；定时触发不会执行 PR 归档。"
            exit 1
          fi

      - name: Archive closed historical pull requests
        shell: bash
        run: |
          set -euo pipefail

          # Archive the repository's current closed-PR inventory; it does not depend on the dispatch commit SHA.

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          query='query($owner: String!, $name: String!, $cursor: String) { repository(owner: $owner, name: $name) { pullRequests(first: 100, after: $cursor, states: [CLOSED]) { nodes { id number title timelineItems(itemTypes: [ARCHIVED_EVENT], first: 1) { nodes { __typename } } } pageInfo { hasNextPage endCursor } } } }'
          mutation='mutation($pullRequestId: ID!) { archivePullRequest(input: {pullRequestId: $pullRequestId}) { pullRequest { number } } }'
          cursor=""
          candidates="$RUNNER_TEMP/closed-prs-to-archive.jsonl"
          : > "$candidates"

          # Collect every closed PR first; open PRs are deliberately excluded.
          while true; do
            args=(-f "query=$query" -f "owner=$owner" -f "name=$repo")
            if [[ -n "$cursor" ]]; then args+=(-f "cursor=$cursor"); fi
            page="$(gh api graphql "${args[@]}")"
            jq -c '.data.repository.pullRequests.nodes[] | select((.timelineItems.nodes | length) == 0)' <<< "$page" >> "$candidates"
            has_next="$(jq -r '.data.repository.pullRequests.pageInfo.hasNextPage' <<< "$page")"
            cursor="$(jq -r '.data.repository.pullRequests.pageInfo.endCursor // empty' <<< "$page")"
            [[ "$has_next" == "true" ]] || break
            [[ -n "$cursor" ]] || { echo "::error::GraphQL 分页游标缺失。"; exit 1; }
          done

          count="$(wc -l < "$candidates" | tr -d ' ')"
          echo "发现 $count 个尚未归档的已关闭/已合并 PR；Open PR 不会被处理。"
          {
            echo "## PR 归档清单"
            echo ""
            if [[ "$count" == "0" ]]; then
              echo "没有需要归档的历史 PR。"
            else
              while IFS= read -r pr; do
                number="$(jq -r '.number' <<< "$pr")"
                title="$(jq -r '.title' <<< "$pr")"
                echo "- #$number — $title"
              done < "$candidates"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          failures="$RUNNER_TEMP/pr-archive-failures.txt"
          : > "$failures"
          succeeded=0
          failed=0

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            pr_id="$(jq -r '.id' <<< "$pr")"
            number="$(jq -r '.number' <<< "$pr")"
            title="$(jq -r '.title' <<< "$pr")"

            # The archive mutation's returned PullRequest is the authoritative
            # acknowledgement. Do not infer success from an ARCHIVED_EVENT
            # timeline read, which can lag or be unavailable after archiving.
            if mutation_result="$(gh api graphql -f query="$mutation" -f pullRequestId="$pr_id")"; then
              returned_number="$(jq -r '.data.archivePullRequest.pullRequest.number // empty' <<< "$mutation_result")"
              if [[ "$returned_number" == "$number" ]]; then
                echo "已归档 PR #$number：$title"
                succeeded=$((succeeded + 1))
              else
                echo "::error::PR #$number 的归档 mutation 未返回预期 PR 编号：$title"
                printf 'PR #%s — %s（mutation 返回异常）\n' "$number" "$title" >> "$failures"
                failed=$((failed + 1))
              fi
            else
              echo "::error::PR #$number 归档请求失败：$title"
              printf 'PR #%s — %s（归档请求失败）\n' "$number" "$title" >> "$failures"
              failed=$((failed + 1))
            fi
          done < "$candidates"

          {
            echo "## PR 归档执行结果"
            echo "- 成功：$succeeded"
            echo "- 失败：$failed"
            if [[ "$failed" -gt 0 ]]; then
              echo ""
              cat "$failures"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::$failed 个 PR 的归档 mutation 实际失败；其他 PR 已继续处理，请查看上方清单。"
            exit 1
          fi

          echo "已完成历史 PR 归档；这些 PR 对无仓库访问权限的访客将返回 404。"

  reset-main-history:
    runs-on: ubuntu-latest
    steps:
      - name: Explain that no changes will be made
        if: ${{ inputs.confirm_reset != 'yes' }}
        run: |
          echo "已选择 no。本次运行不会修改任何分支或提交历史。"

      - name: Validate destructive confirmation
        if: ${{ inputs.confirm_reset == 'yes' }}
        shell: bash
        env:
          CONFIRMATION_TEXT: ${{ inputs.confirmation_text }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION_TEXT" != "DELETE ALL BRANCH COMMITS" ]]; then
            echo "::error::二次确认不匹配。必须准确输入 DELETE ALL BRANCH COMMITS。"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::请从 main 分支手动运行此 workflow；定时触发不会执行分支历史重置。"
            exit 1
          fi

      - name: Checkout the exact dispatched main revision
        if: ${{ inputs.confirm_reset == 'yes' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Replace history of every branch with one root commit
        if: ${{ inputs.confirm_reset == 'yes' && github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-remote --heads origin > "$RUNNER_TEMP/branch-inventory.txt"
          current_main_sha="$(awk '$2 == "refs/heads/main" {print $1}' "$RUNNER_TEMP/branch-inventory.txt")"
          if [[ -z "$current_main_sha" || "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main 分支已变化，或触发时 SHA 不匹配；未开始重置。"
            exit 1
          fi
          branch_count="$(wc -l < "$RUNNER_TEMP/branch-inventory.txt" | tr -d ' ')"
          echo "本次将处理 $branch_count 个远程分支。"
          { echo '## 全分支历史重置清单'; echo ''; cat "$RUNNER_TEMP/branch-inventory.txt"; echo ''; } >> "$GITHUB_STEP_SUMMARY"
          index=0
          while read -r expected_sha ref_name; do
            [[ -n "$expected_sha" && -n "$ref_name" ]] || continue
            branch="${ref_name#refs/heads/}"
            index=$((index + 1))
            echo "[$index/$branch_count] 重置分支 $branch（原 SHA：$expected_sha）"
            current_sha="$(git ls-remote origin "$ref_name" | awk 'NR == 1 {print $1}')"
            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "::error::分支 $branch 在清单生成后发生变化；停止以避免覆盖新提交。"
              exit 1
            fi
            git checkout --detach "$expected_sha"
            orphan_branch="history-reset-${GITHUB_RUN_ID}-${index}"
            git checkout --orphan "$orphan_branch"
            git add --all
            git commit --allow-empty -m "Reset $branch history to current repository snapshot"
            git push --force-with-lease="$ref_name:$expected_sha" origin "HEAD:$ref_name"
            echo "分支 $branch 已重置。"
            git checkout --detach "$expected_sha"
          done < "$RUNNER_TEMP/branch-inventory.txt"
          echo "已处理清单中的全部远程分支。"
          echo "::notice::此操作重写 refs/heads/* 的分支历史；不会删除非 Release 标签、fork、缓存、GitHub 内部保留数据或 PR 引用。受保护分支可能拒绝强制推送并导致流程中止。"
