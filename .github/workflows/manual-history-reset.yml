name: Manual Git History Reset

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: "是否将 main 分支历史重置为仅保留当前文件快照？"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      confirmation_text:
        description: '只有选择 yes 时，才输入：DELETE ALL COMMITS'
        required: false
        type: string
      archive_closed_prs:
        description: "是否同时归档所有已关闭/已合并的历史 PR（普通访客将看到 404）？"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      archive_confirmation:
        description: '只有选择 yes 时，才输入：ARCHIVE CLOSED PULL REQUESTS'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manual-history-reset-main
  cancel-in-progress: false

jobs:
  reset-main-history:
    runs-on: ubuntu-latest
    steps:
      - name: Explain that no changes will be made
        if: ${{ inputs.confirm_reset != 'yes' }}
        run: |
          echo "已选择 no。本次运行不会修改任何分支或提交历史。"

      - name: Validate destructive confirmation
        if: ${{ inputs.confirm_reset == 'yes' }}
        shell: bash
        env:
          CONFIRMATION_TEXT: ${{ inputs.confirmation_text }}
          ARCHIVE_CLOSED_PRS: ${{ inputs.archive_closed_prs }}
          ARCHIVE_CONFIRMATION: ${{ inputs.archive_confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION_TEXT" != "DELETE ALL COMMITS" ]]; then
            echo "::error::二次确认不匹配。必须准确输入 DELETE ALL COMMITS。"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::请从 main 分支手动运行此 workflow。"
            exit 1
          fi
          if [[ "$ARCHIVE_CLOSED_PRS" == "yes" ]]; then
            if [[ "$CONFIRMATION_TEXT" != "DELETE ALL COMMITS" ]]; then
              echo "::error::归档历史 PR 只能与已确认的 main 历史重置一起执行。"
              exit 1
            fi
            if [[ "$ARCHIVE_CONFIRMATION" != "ARCHIVE CLOSED PULL REQUESTS" ]]; then
              echo "::error::PR 归档二次确认不匹配。必须准确输入 ARCHIVE CLOSED PULL REQUESTS。"
              exit 1
            fi
          fi

      - name: Archive closed historical pull requests
        if: ${{ inputs.confirm_reset == 'yes' && inputs.archive_closed_prs == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Refuse to archive anything if main has moved since this run was dispatched.
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main 分支在启动后已发生变化。为避免归档错误的 PR，已中止。"
            exit 1
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          query='query($owner: String!, $name: String!, $cursor: String) { repository(owner: $owner, name: $name) { pullRequests(first: 100, after: $cursor, states: [CLOSED]) { nodes { id number title isArchived } pageInfo { hasNextPage endCursor } } } }'
          mutation='mutation($pullRequestId: ID!) { archivePullRequest(input: {pullRequestId: $pullRequestId}) { pullRequest { number state isArchived } } }'
          cursor=""
          candidates="$RUNNER_TEMP/closed-prs-to-archive.jsonl"
          : > "$candidates"

          # Collect every closed PR first; open PRs are deliberately excluded.
          while true; do
            args=(-f "query=$query" -f "owner=$owner" -f "name=$repo")
            if [[ -n "$cursor" ]]; then args+=(-f "cursor=$cursor"); fi
            page="$(gh api graphql "${args[@]}")"
            jq -c '.data.repository.pullRequests.nodes[] | select(.isArchived == false)' <<< "$page" >> "$candidates"
            has_next="$(jq -r '.data.repository.pullRequests.pageInfo.hasNextPage' <<< "$page")"
            cursor="$(jq -r '.data.repository.pullRequests.pageInfo.endCursor // empty' <<< "$page")"
            [[ "$has_next" == "true" ]] || break
            [[ -n "$cursor" ]] || { echo "::error::GraphQL 分页游标缺失。"; exit 1; }
          done

          count="$(wc -l < "$candidates" | tr -d ' ')"
          echo "发现 $count 个尚未归档的已关闭/已合并 PR；Open PR 不会被处理。"
          {
            echo "## PR 归档清单"
            echo ""
            if [[ "$count" == "0" ]]; then
              echo "没有需要归档的历史 PR。"
            else
              while IFS= read -r pr; do
                number="$(jq -r '.number' <<< "$pr")"
                title="$(jq -r '.title' <<< "$pr")"
                echo "- #$number — $title"
              done < "$candidates"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            pr_id="$(jq -r '.id' <<< "$pr")"
            number="$(jq -r '.number' <<< "$pr")"
            title="$(jq -r '.title' <<< "$pr")"
            result="$(gh api graphql -f query="$mutation" -f pullRequestId="$pr_id")"
            archived="$(jq -r '.data.archivePullRequest.pullRequest.isArchived // false' <<< "$result")"
            if [[ "$archived" != "true" ]]; then
              echo "::error::PR #$number 归档后验证失败：$title"
              exit 1
            fi
            echo "已归档 PR #$number：$title"
          done < "$candidates"

          echo "已完成历史 PR 归档；这些 PR 对无仓库访问权限的访客将返回 404。"

      - name: Checkout the exact dispatched main revision
        if: ${{ inputs.confirm_reset == 'yes' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Replace main history with one new root commit
        if: ${{ inputs.confirm_reset == 'yes' }}
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$current_main_sha" || "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main 分支在启动后已发生变化。为避免覆盖新提交，已中止；请重新检查后再运行。"
            exit 1
          fi

          orphan_branch="history-reset-${GITHUB_RUN_ID}"
          git checkout --orphan "$orphan_branch"
          git add --all

          if git diff --cached --quiet; then
            echo "::error::当前工作树没有可提交的文件，已中止。"
            exit 1
          fi

          git commit -m "Reset main history to current repository snapshot"

          # Force-with-lease ensures main is still exactly the revision reviewed above.
          git push --force-with-lease="refs/heads/main:$EXPECTED_MAIN_SHA" origin "HEAD:refs/heads/main"

          echo "main 分支现已替换为一个新的根提交。"
          echo "::notice::此操作只重写 main；其他分支、标签、PR 引用、fork、缓存及 GitHub 保留的数据不会因此自动清除。"
