name: Repository-wide History Maintenance

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      keep_days:
        description: 保留最近多少天的历史记录
        required: true
        default: 7
        type: number
      keep_count:
        description: 至少保留最近多少条记录
        required: true
        default: 30
        type: number
      confirm_reset:
        description: "是否将所有分支历史重置为仅保留各分支当前文件快照？"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      confirmation_text:
        description: '只有选择 yes 时，才输入：DELETE ALL BRANCH COMMITS'
        required: false
        type: string
      archive_closed_prs:
        description: "是否同时归档所有已关闭/已合并的历史 PR（普通访客将看到 404）？"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      archive_confirmation:
        description: '只有选择 yes 时，才输入：ARCHIVE CLOSED PULL REQUESTS'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: repository-history-maintenance
  cancel-in-progress: false

jobs:
  cleanup-repository-history:
    name: Clean releases and Actions across the repository
    runs-on: ubuntu-latest
    steps:
      - name: Validate retention settings
        shell: bash
        env:
          KEEP_DAYS_INPUT: ${{ inputs.keep_days || 7 }}
          KEEP_COUNT_INPUT: ${{ inputs.keep_count || 30 }}
        run: |
          set -Eeuo pipefail
          [[ "$KEEP_DAYS_INPUT" =~ ^[1-9][0-9]*$ ]] || { echo '::error::保留天数必须是正整数。'; exit 1; }
          [[ "$KEEP_COUNT_INPUT" =~ ^[1-9][0-9]*$ ]] || { echo '::error::保留数量必须是正整数。'; exit 1; }
          echo "KEEP_DAYS=$KEEP_DAYS_INPUT" >> "$GITHUB_ENV"
          echo "KEEP_COUNT=$KEEP_COUNT_INPUT" >> "$GITHUB_ENV"

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CUTOFF="$(date -u -d "$KEEP_DAYS days ago" +%s)"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq '[.[][]]' > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" "$CUTOFF" "$KEEP_COUNT" <<'PY' > "$RUNNER_TEMP/old-release-tags.txt"
          import datetime, json, sys
          path, cutoff, keep_count = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          releases = json.load(open(path, encoding='utf-8'))
          stable = [r for r in releases if not r.get('prerelease') and r.get('tag_name') != 'toolchain-cache']
          stable.sort(key=lambda r: r.get('published_at') or '', reverse=True)
          kept = 0
          for release in stable:
              tag, published = release.get('tag_name'), release.get('published_at')
              if not tag or not published:
                  continue
              dt = datetime.datetime.fromisoformat(published.replace('Z', '+00:00'))
              if kept == 0 or (dt.timestamp() >= cutoff and kept < keep_count):
                  kept += 1
              else:
                  print(tag)
          PY
          RELEASE_DELETED=0
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "删除旧 Release：$tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            RELEASE_DELETED=$((RELEASE_DELETED + 1))
          done < "$RUNNER_TEMP/old-release-tags.txt"

      - name: Delete old Actions runs from every workflow and branch
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            | jq '[.[][] | .workflow_runs[]?]' > "$RUNNER_TEMP/all-workflow-runs.json"
          CUTOFF="$(date -u -d "$KEEP_DAYS days ago" +%s)"
          python3 - "$RUNNER_TEMP/all-workflow-runs.json" "$CUTOFF" "$KEEP_COUNT" "$CURRENT_RUN_ID" <<'PY' > "$RUNNER_TEMP/old-run-ids.txt"
          import datetime, json, sys
          path, cutoff, keep_count, current_id = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          runs = json.load(open(path, encoding='utf-8'))
          completed = [r for r in runs if r.get('status') == 'completed']
          completed.sort(key=lambda r: r.get('created_at') or '', reverse=True)
          kept = 0
          for run in completed:
              run_id = str(run.get('id', ''))
              if not run_id or run_id == current_id:
                  continue
              created = run.get('created_at')
              if not created:
                  print(run_id)
                  continue
              dt = datetime.datetime.fromisoformat(created.replace('Z', '+00:00'))
              if dt.timestamp() >= cutoff and kept < keep_count:
                  kept += 1
              else:
                  print(run_id)
          PY
          RUN_DELETED=0
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "删除 Actions 运行记录：$run_id"
            gh run delete "$run_id" --repo "$GITHUB_REPOSITORY"
            RUN_DELETED=$((RUN_DELETED + 1))
          done < "$RUNNER_TEMP/old-run-ids.txt"
          {
            echo '## 全仓库历史清理结果'
            echo "- 范围：全部 workflows、全部分支的 Actions 运行记录"
            echo "- 保留天数：$KEEP_DAYS 天"
            echo "- 保留数量：$KEEP_COUNT 条"
            echo "- 删除 Actions 运行记录：$RUN_DELETED 条"
          } >> "$GITHUB_STEP_SUMMARY"

  reset-all-branch-history:
    name: Manually reset commit history on all branches
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_reset == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain that no changes will be made
        if: ${{ inputs.confirm_reset != 'yes' }}
        run: |
          echo "已选择 no。本次运行不会修改任何分支或提交历史。"

      - name: Validate destructive confirmation
        if: ${{ inputs.confirm_reset == 'yes' }}
        shell: bash
        env:
          CONFIRMATION_TEXT: ${{ inputs.confirmation_text }}
          ARCHIVE_CLOSED_PRS: ${{ inputs.archive_closed_prs }}
          ARCHIVE_CONFIRMATION: ${{ inputs.archive_confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION_TEXT" != "DELETE ALL BRANCH COMMITS" ]]; then
            echo "::error::二次确认不匹配。必须准确输入 DELETE ALL BRANCH COMMITS。"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::请从 main 分支手动运行此 workflow。"
            exit 1
          fi
          if [[ "$ARCHIVE_CLOSED_PRS" == "yes" && "$ARCHIVE_CONFIRMATION" != "ARCHIVE CLOSED PULL REQUESTS" ]]; then
            echo "::error::PR 归档二次确认不匹配。必须准确输入 ARCHIVE CLOSED PULL REQUESTS。"
            exit 1
          fi

      - name: Archive closed historical pull requests
        if: ${{ inputs.confirm_reset == 'yes' && inputs.archive_closed_prs == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Refuse to archive anything if main has moved since this run was dispatched.
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main 分支在启动后已发生变化。为避免归档错误的 PR，已中止。"
            exit 1
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          query='query($owner: String!, $name: String!, $cursor: String) { repository(owner: $owner, name: $name) { pullRequests(first: 100, after: $cursor, states: [CLOSED]) { nodes { id number title timelineItems(itemTypes: [ARCHIVED_EVENT], first: 1) { nodes { __typename } } } pageInfo { hasNextPage endCursor } } } }'
          verify_query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { timelineItems(itemTypes: [ARCHIVED_EVENT], first: 1) { nodes { __typename } } } } }'
          mutation='mutation($pullRequestId: ID!) { archivePullRequest(input: {pullRequestId: $pullRequestId}) { pullRequest { number } } }'
          cursor=""
          candidates="$RUNNER_TEMP/closed-prs-to-archive.jsonl"
          : > "$candidates"

          # Collect every closed PR first; open PRs are deliberately excluded.
          while true; do
            args=(-f "query=$query" -f "owner=$owner" -f "name=$repo")
            if [[ -n "$cursor" ]]; then args+=(-f "cursor=$cursor"); fi
            page="$(gh api graphql "${args[@]}")"
            jq -c '.data.repository.pullRequests.nodes[] | select((.timelineItems.nodes | length) == 0)' <<< "$page" >> "$candidates"
            has_next="$(jq -r '.data.repository.pullRequests.pageInfo.hasNextPage' <<< "$page")"
            cursor="$(jq -r '.data.repository.pullRequests.pageInfo.endCursor // empty' <<< "$page")"
            [[ "$has_next" == "true" ]] || break
            [[ -n "$cursor" ]] || { echo "::error::GraphQL 分页游标缺失。"; exit 1; }
          done

          count="$(wc -l < "$candidates" | tr -d ' ')"
          echo "发现 $count 个尚未归档的已关闭/已合并 PR；Open PR 不会被处理。"
          {
            echo "## PR 归档清单"
            echo ""
            if [[ "$count" == "0" ]]; then
              echo "没有需要归档的历史 PR。"
            else
              while IFS= read -r pr; do
                number="$(jq -r '.number' <<< "$pr")"
                title="$(jq -r '.title' <<< "$pr")"
                echo "- #$number — $title"
              done < "$candidates"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            pr_id="$(jq -r '.id' <<< "$pr")"
            number="$(jq -r '.number' <<< "$pr")"
            title="$(jq -r '.title' <<< "$pr")"
            gh api graphql -f query="$mutation" -f pullRequestId="$pr_id" >/dev/null
            verification="$(gh api graphql -f query="$verify_query" -f owner="$owner" -f name="$repo" -F number="$number")"
            archived="$(jq -r '(.data.repository.pullRequest.timelineItems.nodes | length) > 0' <<< "$verification")"
            if [[ "$archived" != "true" ]]; then
              echo "::error::PR #$number 归档后验证失败：$title"
              exit 1
            fi
            echo "已归档 PR #$number：$title"
          done < "$candidates"

          echo "已完成历史 PR 归档；这些 PR 对无仓库访问权限的访客将返回 404。"

      - name: Checkout repository and reset every branch to its current snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Replace commit history on every branch with one root commit
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$current_main_sha" || "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main 分支在启动后已发生变化。为避免覆盖新提交，已中止。"
            exit 1
          fi

          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort)
          if (( ${#branches[@]} == 0 )); then
            echo "::error::没有发现远程分支。"
            exit 1
          fi

          printf '即将重写以下 %s 个分支的提交历史：\n' "${#branches[@]}"
          printf ' - %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            expected_sha="$(git rev-parse "refs/remotes/origin/$branch")"
            safe_branch="$(printf '%s' "$branch" | tr '/:' '--')"
            orphan_branch="history-reset-${GITHUB_RUN_ID}-${safe_branch}"
            echo "::group::重置分支 $branch"
            git checkout --orphan "$orphan_branch" "refs/remotes/origin/$branch"
            git add --all
            if git diff --cached --quiet; then
              echo "::error::分支 $branch 没有可提交的文件，停止以避免产生空快照。"
              exit 1
            fi
            git commit -m "Reset $branch history to current repository snapshot"
            git push --force-with-lease="refs/heads/$branch:$expected_sha" origin "HEAD:refs/heads/$branch"
            echo "分支 $branch 已重置为单个根提交。"
            echo "::endgroup::"
          done

          echo "所有远程分支的提交历史已重置。"
          echo "::warning::此操作不会自动删除标签、Release 引用、PR 引用、fork 或 GitHub 保留的数据；受分支保护规则限制的分支可能拒绝强制推送。"
