name: MyUpdate OTA contract tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ota-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test version ordering and Tag contract
        run: python3 -m unittest discover -s tests/ota -p 'test_*.py' -v

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find luci-app-myupdate/root -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            sh -n "$file"
          done
          find scripts .github/ci -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            bash -n "$file"
          done
