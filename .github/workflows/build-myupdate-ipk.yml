name: 编译在线升级插件

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-myupdate-ipk
  cancel-in-progress: false

jobs:
  build:
    name: 仅编译 luci-app-myupdate 软件包
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出 MyLEDE 仓库源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          path: mylede

      - name: 安装 OpenWrt 编译依赖
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache ecj fastjar \
            libelf-dev libzstd-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: 检出 LEDE 源码
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede

      - name: 准备软件源与本地软件包
        shell: bash
        working-directory: lede
        run: |
          set -Eeuo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/lean
          ln -s "$GITHUB_WORKSPACE/mylede/luci-app-myupdate" package/lean/luci-app-myupdate
          ln -s "$GITHUB_WORKSPACE/mylede/minisign" package/lean/minisign
          test -f package/lean/luci-app-myupdate/Makefile
          test -f package/lean/minisign/Makefile
          test -f feeds/luci/luci.mk

      - name: 编译 MyUpdate 软件包
        shell: bash
        env:
          TOPDIR: ${{ github.workspace }}/lede
          OUTPUT_DIR: ${{ github.workspace }}/myupdate-ipk
        run: |
          set -Eeuo pipefail
          bash mylede/scripts/build-myupdate-package.sh

      - name: 检查 IPK 编译产物
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(myupdate-ipk/luci-app-myupdate_*.ipk)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::主插件 IPK 不存在，拒绝上传空 Artifact。"
            exit 1
          fi
          ls -lh myupdate-ipk/
          sha256sum myupdate-ipk/*.ipk

      - name: 上传可安装的 IPK 文件
        uses: actions/upload-artifact@v7
        with:
          name: MyUpdate 安装包
          path: myupdate-ipk/*.ipk
          if-no-files-found: error
          retention-days: 14
