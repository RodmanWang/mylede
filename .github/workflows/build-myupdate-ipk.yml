name: Build MyUpdate IPK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-myupdate-ipk
  cancel-in-progress: false

jobs:
  build:
    name: Compile luci-app-myupdate only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout MyLEDE repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          path: mylede

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache ecj fastjar \
            libelf-dev libzstd-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Checkout LEDE source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede

      - name: Prepare feeds and local MyUpdate package
        shell: bash
        working-directory: lede
        run: |
          set -Eeuo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/lean
          ln -s "$GITHUB_WORKSPACE/mylede/luci-app-myupdate" package/lean/luci-app-myupdate
          test -f package/lean/luci-app-myupdate/Makefile
          test -f feeds/luci/luci.mk

      - name: Compile MyUpdate package
        shell: bash
        env:
          TOPDIR: ${{ github.workspace }}/lede
          OUTPUT_DIR: ${{ github.workspace }}/myupdate-ipk
        run: |
          set -Eeuo pipefail
          bash mylede/scripts/build-myupdate-package.sh

      - name: Verify IPK output
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(myupdate-ipk/luci-app-myupdate_*.ipk)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::主插件 IPK 不存在，拒绝上传空 Artifact。"
            exit 1
          fi
          ls -lh myupdate-ipk/
          sha256sum myupdate-ipk/*.ipk

      - name: Upload installable IPK files
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-myupdate-ipk
          path: myupdate-ipk/*.ipk
          if-no-files-found: error
          retention-days: 14
